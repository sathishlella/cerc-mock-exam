<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Interactive CERC mock exam: 50 questions with an explanation on every option, in study or timed exam mode.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128203;</text></svg>">
<title>CERC Mock Exam</title>
<style>
  :root{
    --paper:#FFFFFF; --card:#FFFFFF; --card-2:#EFF4F4;
    --ink:#101D1C; --ink-2:#3A4C4B; --muted:#6B7C7B; --line:#DDE6E6;
    --accent:#0F5C57; --accent-soft:#E3F0EE; --accent-ink:#0B3F3B; --on-accent:#FFFFFF;
    --ok:#1C7A4A; --ok-soft:#E4F4EA; --no:#A8352F; --no-soft:#FBE8E6;
    --flag:#8F6410; --flag-soft:#F9F0DB;
    /* gloss: a lifted white surface reads as sheen, not a grey card on a grey ground */
    --gloss:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(16,29,28,.05), 0 12px 28px -20px rgba(16,29,28,.28);
    --gloss-hi:0 1px 0 rgba(255,255,255,.85);
    --font-display:Georgia,"Iowan Old Style","Times New Roman",serif;
    --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r:12px;
  }

  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); min-height:100vh;
    background:var(--paper);
    background-image:
      radial-gradient(120% 60% at 50% -10%, rgba(15,92,87,.07) 0%, rgba(15,92,87,0) 60%),
      linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 55%, #F3F8F8 100%);
    background-attachment:fixed; background-repeat:no-repeat;
    font-family:var(--font-ui); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  }
  .wrap{max-width:780px; margin:0 auto; padding:0 20px 88px}
  h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0}
  p{margin:0}
  button{font-family:inherit; font-size:inherit; cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);
  }

  /* ---------- start ---------- */
  .hero{padding:64px 0 32px; display:flex; flex-direction:column; gap:18px}
  .hero h1{font-size:clamp(34px,6vw,50px); line-height:1.08; letter-spacing:-.02em}
  .hero .lede{color:var(--ink-2); font-size:17px; max-width:60ch}
  .rule{height:1px; background:var(--line); border:0; margin:0}

  .facts{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr));
    gap:1px; background:var(--line); border:1px solid var(--line);
    border-radius:var(--r); overflow:hidden; margin:28px 0;
  }
  .fact{background:var(--card); padding:14px 16px; display:flex; flex-direction:column; gap:3px; box-shadow:var(--gloss-hi)}
  .fact b{font-family:var(--font-mono); font-size:22px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .fact span{font-size:12px; color:var(--muted)}

  .modes{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:8px 0 26px}
  @media (max-width:560px){.modes{grid-template-columns:1fr}}
  .mode{
    position:relative; text-align:left; border-radius:var(--r); padding:20px;
    display:flex; flex-direction:column; gap:7px; overflow:hidden;
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .mode b{font-family:var(--font-display); font-size:20px; font-weight:600; letter-spacing:-.01em}
  .mode .desc{font-size:13.5px; line-height:1.5}
  .mode .go{
    margin-top:5px; font-family:var(--font-mono); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; display:flex; align-items:center; gap:7px;
  }
  .mode .go i{font-style:normal; transition:transform .18s}
  .mode:hover .go i{transform:translateX(4px)}
  .mode .tag{
    position:absolute; top:14px; right:14px; font-family:var(--font-mono);
    font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px;
  }

  /* Study is the primary path, so it carries the solid accent; exam is the
     tinted counterpart. Both sit forward of the white ground. */
  .mode.primary{
    background:linear-gradient(180deg,#17756D 0%,#0F5C57 100%);
    border:1px solid #0B4A46; color:#FFFFFF;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 2px 5px rgba(15,92,87,.22), 0 18px 32px -18px rgba(15,92,87,.6);
  }
  .mode.primary .desc{color:rgba(255,255,255,.86)}
  .mode.primary .go{color:rgba(255,255,255,.95)}
  .mode.primary .tag{background:rgba(255,255,255,.92); color:var(--accent-ink)}
  .mode.primary:hover{transform:translateY(-3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 3px 7px rgba(15,92,87,.26), 0 26px 44px -20px rgba(15,92,87,.7)}

  .mode.secondary{
    background:linear-gradient(180deg,#FFFFFF 0%,var(--accent-soft) 100%);
    border:1.5px solid var(--accent); color:var(--ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 5px rgba(16,29,28,.06), 0 16px 30px -20px rgba(16,29,28,.4);
  }
  .mode.secondary .desc{color:var(--ink-2)}
  .mode.secondary .go{color:var(--accent)}
  .mode.secondary:hover{transform:translateY(-3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 3px 7px rgba(16,29,28,.08), 0 24px 40px -20px rgba(16,29,28,.5)}
  .mode:active{transform:translateY(0)}

  .note{
    background:var(--accent-soft); border-left:3px solid var(--accent);
    border-radius:0 var(--r) var(--r) 0; padding:14px 16px;
    font-size:14px; color:var(--ink-2); display:flex; flex-direction:column; gap:8px;
  }
  .note b{color:var(--ink)}

  .breakdown{width:100%; border-collapse:collapse; margin-top:14px; font-size:14px}
  .breakdown th,.breakdown td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line)}
  .breakdown th{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:500}
  .breakdown td:last-child,.breakdown th:last-child{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums}

  /* ---------- header + rail ---------- */
  .bar{
    position:sticky; top:0; z-index:20; background:rgba(255,255,255,.88); backdrop-filter:saturate(1.6) blur(12px); -webkit-backdrop-filter:saturate(1.6) blur(12px);
    border-bottom:1px solid var(--line); padding:10px 0 0;
  }
  .bar-in{max-width:780px; margin:0 auto; padding:0 20px}
  .bar-row{display:flex; align-items:center; gap:14px; justify-content:space-between; padding-bottom:9px}
  .bar-left{display:flex; align-items:baseline; gap:10px; min-width:0}
  .bar-title{font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
  .timer{
    font-family:var(--font-mono); font-size:15px; font-variant-numeric:tabular-nums;
    padding:2px 9px; border-radius:6px; background:var(--card-2); color:var(--ink-2);
  }
  .timer.low{background:var(--no-soft); color:var(--no)}
  .bar-right{display:flex; align-items:center; gap:8px}
  .mini{
    background:transparent; border:1px solid var(--line); color:var(--ink-2);
    border-radius:7px; padding:5px 11px; font-size:13px; white-space:nowrap;
  }
  .mini:hover{border-color:var(--accent); color:var(--accent)}
  .mini.on{background:var(--flag-soft); border-color:var(--flag); color:var(--flag)}

  .rail{display:flex; gap:2px; padding-bottom:4px; touch-action:manipulation}
  .tick{
    flex:1; height:21px; min-width:0; padding:7px 0; border:0; border-radius:2px;
    background:var(--line); background-clip:content-box;
    transition:background .15s, transform .15s;
  }
  .tick:hover{transform:scaleY(1.6)}
  .tick.done{background:var(--muted)}
  .tick.ok{background:var(--ok)}
  .tick.no{background:var(--no)}
  .tick.flag{background:var(--flag)}
  .tick.now{background:var(--accent); transform:scaleY(1.9)}

  /* ---------- question ---------- */
  .qhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:30px 0 12px}
  .num{font-family:var(--font-mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .chip{
    font-size:11px; font-family:var(--font-mono); letter-spacing:.06em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; background:var(--card-2); color:var(--ink-2);
  }
  .chip.src{background:var(--accent-soft); color:var(--accent-ink)}
  .stem{font-family:var(--font-display); font-size:23px; line-height:1.36; letter-spacing:-.01em; margin-bottom:20px}

  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{
    display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:13px 15px; color:var(--ink); line-height:1.45; box-shadow:var(--gloss-hi);
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  .opt:not(:disabled):hover{border-color:var(--accent); background:var(--accent-soft)}
  .opt:disabled{cursor:default}
  .ltr{
    flex:0 0 24px; height:24px; border-radius:6px; background:var(--card-2);
    font-family:var(--font-mono); font-size:12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; color:var(--ink-2); margin-top:1px;
  }
  .opt.correct{border-color:var(--ok); background:var(--ok-soft)}
  .opt.correct .ltr{background:var(--ok); color:#fff}
  .opt.wrong{border-color:var(--no); background:var(--no-soft)}
  .opt.wrong .ltr{background:var(--no); color:#fff}
  .opt.picked{border-width:2px}
  .otext{flex:1; min-width:0}
  .why{display:block; font-size:13.5px; color:var(--ink-2); margin-top:5px; line-height:1.5}
  .verdict{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; margin-right:6px}
  .verdict.y{color:var(--ok)} .verdict.n{color:var(--no)}

  .key{
    margin-top:16px; background:var(--card); box-shadow:var(--gloss-hi); border:1px solid var(--line);
    border-left:3px solid var(--accent); border-radius:0 var(--r) var(--r) 0; padding:14px 16px;
  }
  .key .eyebrow{display:block; margin-bottom:5px}
  .key p{font-size:14.5px; color:var(--ink-2); line-height:1.55}
  .key .ref{display:block; margin-top:8px; font-family:var(--font-mono); font-size:11.5px; color:var(--muted)}

  .nav{display:flex; gap:10px; margin-top:26px; align-items:center}
  .btn{
    background:var(--accent); color:var(--on-accent); border:0; border-radius:8px;
    padding:11px 22px; font-weight:600; font-size:15px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--line); font-weight:500}
  .btn.ghost:hover{border-color:var(--accent); color:var(--accent); filter:none}
  .btn:disabled{opacity:.35; cursor:default; filter:none}
  .spacer{flex:1}

  /* ---------- results ---------- */
  .score{display:flex; align-items:baseline; gap:14px; margin:8px 0 4px}
  .score b{font-family:var(--font-mono); font-size:66px; font-weight:600; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums}
  .verdictbig{font-family:var(--font-display); font-size:22px; font-weight:600}
  .pass{color:var(--ok)} .fail{color:var(--no)}
  .meter{position:relative; height:12px; background:var(--card-2); border-radius:6px; margin:20px 0 6px; overflow:hidden}
  .meter i{display:block; height:100%; background:var(--accent); border-radius:6px}
  .meter i.fail{background:var(--no)}
  .passline{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); opacity:.75}
  .meterlab{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--muted)}
  .revq{border-top:1px solid var(--line); padding:22px 0}

  /* ---------- mobile ---------- */
  @media (max-width:640px){
    body{font-size:15.5px}
    .wrap{padding:0 16px 72px}
    .bar-in{padding:0 16px}
    .hero{padding:40px 0 24px; gap:14px}
    .hero .lede{font-size:16px}
    .facts{grid-template-columns:repeat(3,1fr); margin:22px 0}
    .fact{padding:11px 12px}
    .fact b{font-size:19px}
    /* header: let it wrap rather than squeeze the timer and buttons off-screen */
    .bar-row{flex-wrap:wrap; gap:8px 10px}
    .bar-title{font-size:11px}
    .bar-right{margin-left:auto}
    .num.count{display:none}
    .stem{font-size:20px; margin-bottom:16px}
    .qhead{margin:22px 0 10px}
    .opt{padding:12px 13px; gap:10px}
    .why{font-size:13px}
    .nav{flex-wrap:wrap}
    .nav .btn{flex:1 1 auto; min-width:120px; padding:12px 16px}
    .score b{font-size:52px}
    .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
  }
  @media (max-width:380px){
    .facts{grid-template-columns:repeat(2,1fr)}
    .stem{font-size:19px}
  }
  /* touch devices get no hover lift, which otherwise sticks after a tap */
  @media (hover:none){
    .mode:hover{transform:none}
    .mode:hover .go i{transform:none}
    .tick:hover{transform:none}
    .opt:not(:disabled):hover{background:var(--card); border-color:var(--line)}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const TOPICS = [
  "ESG & SDGs",
  "Stakeholder Engagement",
  "Materiality: Impact vs Financial",
  "Material Threats & Opportunities",
  "Carbon Footprint & Net Zero",
  "ESG & Sustainability Reporting",
  "Bursa, NSRF & IFRS S1/S2",
  "ESG Governance",
  "GRI Standards",
  "Greenwashing & Terms"
];

// m:true = concept appears in the official mock paper. ref = manual topic/page.
const Q = [
/*1*/{t:0,m:true,s:"What are the three pillars of Sustainability?",
o:["Environment, Social, Governance","Environment, Economics, Social","Environment, People, Government","Environment, Ergonomic, People"],a:1,
e:["That is ESG, which is a different framework, and the examiners put it here specifically to catch you.","Correct. The three pillars are the Triple Bottom Line: Environment, Economics (Profit), Social (People).","'Government' is not a pillar; governance sits inside ESG, not the sustainability pillars.","'Ergonomic' does not appear anywhere in the syllabus."],
k:"Sustainability = Triple Bottom Line (Planet, Profit, People). ESG = Environment, Social, Governance. They are related but not the same list, and this is the single most-missed question on the mock.",r:"Topic 01: Triple Bottom Line, p.3"},

/*2*/{t:0,m:false,s:"How many Sustainable Development Goals are there, and how many underlying targets?",
o:["17 goals, 169 targets","15 goals, 150 targets","20 goals, 200 targets","17 goals, 100 targets"],a:0,
e:["Correct. 17 goals backed by 169 detailed targets, agreed by nearly all nations on 25 September 2015.","The SDGs replaced the 8 MDGs; neither had 15 goals.","No framework in the syllabus uses 20 goals.","The goal count is right but there are 169 targets, not 100."],
k:"17 goals / 169 targets / adopted 25 Sept 2015 / run through 2030. Memorise all four numbers; any of them can be asked alone.",r:"Topic 01: UN 2030 Agenda, p.6"},

/*3*/{t:0,m:false,s:"According to the manual, what is the main difference between ESG and Sustainability?",
o:["ESG is voluntary, Sustainability is mandatory","ESG focuses more on EXTERNAL investment; Sustainability focuses more on INTERNAL activities","ESG applies only to listed companies","Sustainability covers only environmental matters"],a:1,
e:["Neither is defined by voluntariness in the syllabus.","Correct. ESG leans external/investor-facing; Sustainability leans internal and toward future generations.","Sustainability practice is not restricted by listing status.","Sustainability looks equally at Environmental, Social and Economic factors, so it is broader, not narrower."],
k:"ESG = external, investment-oriented, weighted toward E and S. Sustainability = internal, future-generations focus, balanced across Environmental, Social and Economic.",r:"Topic 01: ESG vs Sustainability, p.4"},

/*4*/{t:0,m:false,s:"Governance criteria in ESG refers to a company's:",
o:["Carbon reduction pathway","Leadership, management philosophy, policies, internal controls and shareholder rights","Relationships with local communities","Compliance with environmental permits"],a:1,
e:["That is an environmental matter.","Correct. Governance covers leadership, management philosophy, practices, policies, internal controls and shareholder rights.","That is Social criteria: managing relationships with and creating value for stakeholders.","Also environmental."],
k:"Environmental = stewardship of nature. Social = relationships with and value for stakeholders. Governance = leadership, policies, internal controls, shareholder rights.",r:"Topic 01: ESG criteria, p.2"},

/*5*/{t:1,m:false,s:"Which level of stakeholder engagement applies to a group with HIGH dependency and HIGH influence?",
o:["Push communication","Consultation","Partnership","Pull communication"],a:2,
e:["Push communication is for low dependency / low influence, the bottom of the ladder.","Consultation suits high dependency but low influence.","Correct. Partnership is the deepest form, reserved for high dependency AND high influence.","Pull communication is the lightest touch of all."],
k:"The engagement ladder, strongest to weakest: Partnership → Dialogue → Consultation → Push communication → Pull communication. Partnership sits at high dependency + high influence.",r:"Topic 02: Type of Stakeholder Engagement, p.18"},

/*6*/{t:1,m:false,s:"A joint-venture agreement is an example of which type of stakeholder engagement?",
o:["Consultation","Partnership","Dialogue","Other communication"],a:1,
e:["Consultation covers focus groups, questionnaires, surveys and internal assessments.","Correct. Joint ventures, local community projects and multi-stakeholder enterprises are Partnership activities.","Dialogue covers grievance mechanisms, advisory boards and multi-stakeholder sessions.","Other communication covers annual reports, town halls, websites and press releases."],
k:"Partnership = joint ventures, community projects. Dialogue = grievance mechanisms, advisory boards. Consultation = surveys, focus groups. Other communication = annual report, website, press release.",r:"Topic 02: Stakeholder Engagement Process, p.18"},

/*7*/{t:1,m:false,s:"The manual sets out three questions to answer before engaging stakeholders. They are:",
o:["Why engage? What to engage about? Who to engage?","When? Where? How much?","Who pays? Who reports? Who audits?","What is material? What is measurable? What is reportable?"],a:0,
e:["Correct. Why engage, What to engage about, Who to engage.","Not in the syllabus.","This confuses engagement with assurance.","These are materiality questions, not engagement questions."],
k:"Three engagement questions: WHY engage, WHAT to engage about, WHO to engage.",r:"Topic 02: Three Questions, p.17"},

/*8*/{t:2,m:true,s:"What are the two types of Materiality?",
o:["Up and Down Impact","Single and Double Materiality","Outward and Inward Impact","Strong and Weak Materiality"],a:2,
e:["Not the syllabus terminology.","Tempting, but the official answer key marks this wrong. Double materiality is the combination of the two, not one of the two.","Correct per the official answer key. Outward = your impact on the world. Inward = the world's impact on your finances.","Not used in any framework here."],
k:"Outward (impact materiality, inside-out, GRI) and Inward (financial materiality, outside-in, ISSB/SASB/TCFD). Double materiality is both directions together; it is the combination, not a 'type'. The mock key insists on Outward/Inward.",r:"Topic 03: Financial vs Impact Materiality, p.24"},

/*10*/{t:2,m:false,s:"Financial materiality is primarily aimed at which stakeholders, and used by which frameworks?",
o:["Investors and regulators: IFRS, SASB and TCFD","NGOs and communities: GRI and the UN SDGs","Employees: ISO 45001","Suppliers: ISO 20400"],a:0,
e:["Correct. Financial materiality serves investors and regulators, and is used in IFRS, SASB and TCFD.","That describes impact materiality.","ISO 45001 is occupational health and safety, unrelated to materiality type.","ISO 20400 is sustainable procurement guidance."],
k:"Financial materiality → investors and regulators → IFRS / SASB / TCFD. Impact materiality → public, NGOs, communities, policymakers → GRI / UN SDGs / EU CSRD.",r:"Topic 04: Financial Materiality, p.25"},

/*11*/{t:2,m:false,s:"Which frameworks are named in the manual as promoting DOUBLE materiality?",
o:["SASB and TCFD","EU CSRD, EFRAG and GRI","ISO 26000 and ISO 37000","FTSE4Good and MSCI"],a:1,
e:["Both are financial-materiality frameworks.","Correct. EU CSRD, EFRAG and GRI promote the double materiality approach.","ISO documents are guidance standards, not materiality frameworks.","These are rating indices, not reporting frameworks."],
k:"Double materiality = financial + impact combined; stakeholders are both investors and society. Promoted by EU CSRD, EFRAG and GRI. Example: water use affecting both company cost and local ecosystem.",r:"Topic 04: Double Materiality, p.25"},

/*12*/{t:2,m:false,s:"Impact materiality is best described as:",
o:["How sustainability issues affect the company's valuation","How the company's activities impact society and the environment, regardless of financial implications","How investors rate the company's ESG score","How auditors verify sustainability data"],a:1,
e:["That is financial materiality.","Correct. Impact materiality is outward-looking and applies regardless of whether there is a financial effect.","That is an ESG rating, not a materiality concept.","That is assurance."],
k:"Impact materiality is 'inside-out' and deliberately indifferent to financial consequence. Pollution harming a community counts even with no immediate cost to the company.",r:"Topic 04: Environmental & Social (Impact) Materiality, p.27"},

/*13*/{t:3,m:false,s:"Which type of materiality recognises that issues immaterial today may become material tomorrow?",
o:["Nested materiality","Sector specific materiality","Dynamic materiality","Double materiality"],a:2,
e:["Nested materiality places impact materiality inside the broader financial and sustainable-development context.","Sector specific materiality covers issues unique to an industry.","Correct. Dynamic materiality is about change over time, emphasised by the World Economic Forum and TCFD.","Double materiality is about two directions of impact, not the passage of time."],
k:"Dynamic materiality = material issues evolve. Example: biodiversity loss becoming a financial risk once new regulation lands. Associated with WEF and TCFD.",r:"Topic 04: Dynamic Materiality, p.26"},

/*14*/{t:3,m:false,s:"Sector specific materiality is most associated with which standards?",
o:["SASB Standards and TCFD sector guidance","GRI 1 Foundation","ISO 9001","The Paris Agreement"],a:0,
e:["Correct. SASB is built industry-by-industry, and TCFD issues sector guidance.","GRI 1 sets the reporting foundation for all organisations, not by sector.","ISO 9001 is quality management.","The Paris Agreement is a climate treaty, not a materiality standard."],
k:"Sector specific materiality → SASB Standards + TCFD sector guidance. Examples: cybersecurity in tech, water use in agriculture, emissions in transport.",r:"Topic 04: Sector Specific Materiality, p.27"},

/*15*/{t:3,m:true,s:"What are the two axes of the Materiality Matrix?",
o:["Stakeholder View and Own Organizational View","Material View and Influence View","Environmental View and Social View","Governance and Government View"],a:0,
e:["Correct. The vertical axis is influence on stakeholder assessments and decisions; the horizontal is the significance of the organisation's economic, environmental and social impacts.","Not the syllabus wording.","The matrix is not split by ESG pillar.","Not a matrix axis."],
k:"Vertical = stakeholder view (influence on stakeholder assessments and decisions). Horizontal = organisational view (significance of economic, environmental and social impacts). Top-right = shared value, the highest priority.",r:"Topic 04: The Materiality Matrix, p.29"},

/*16*/{t:3,m:false,s:"The manual recommends setting sustainability targets the SMART way. SMART stands for:",
o:["Specific, Measurable, Achievable, Relevant, Timed","Sustainable, Material, Accurate, Reported, Tracked","Strategic, Managed, Assured, Reviewed, Transparent","Scientific, Measured, Audited, Ranked, Targeted"],a:0,
e:["Correct. Specific, Measurable, Achievable, Relevant, Timed.","Invented terms.","Invented terms.","Invented terms."],
k:"SMART: Specific, Measurable, Achievable, Relevant, Timed. Note the manual uses 'Timed', not 'Time-bound'.",r:"Topic 04: Setting Targets the SMART Way, p.23"},

/*18*/{t:4,m:true,s:"Which Carbon Emission Scope covers the electricity used in our buildings?",
o:["Scope 1","Scope 2","Scope 3","Scope 4"],a:1,
e:["Scope 1 is direct emissions from sources owned or controlled by the organisation: boilers, furnaces, company vehicles.","Correct. Scope 2 is indirect emissions from purchased electricity, steam and heat, generated where the energy is produced.","Scope 3 is all other indirect emissions in the value chain.","There is no Scope 4 in the GHG Protocol."],
k:"Scope 1 = direct/owned. Scope 2 = purchased energy. Scope 3 = everything else in the value chain. There is no Scope 4; it is always a distractor.",r:"Topic 05: Scope of Carbon Emissions, p.41"},

/*19*/{t:4,m:true,s:"Greenhouse gas emissions are calculated in which unit?",
o:["Tons of CO2","Tons of Gas","Tons of CO2e","Tons of Nitrogen"],a:2,
e:["CO2 alone ignores the other greenhouse gases.","Not a unit.","Correct. Tonnes of carbon dioxide EQUIVALENT, with all GHGs converted to a common basis.","Nitrogen is not the reporting basis."],
k:"tCO2e, and the 'e' matters. Different gases have different warming potentials, so all are expressed as CO2-equivalent.",r:"Topic 05: Calculating Carbon Footprint, p.42"},

/*20*/{t:4,m:false,s:"Which of these is a Scope 3 emission?",
o:["Fuel burned in a company-owned boiler","Purchased electricity for the head office","Employee commuting and business travel","Diesel used in the company's own delivery trucks"],a:2,
e:["Owned combustion equipment is Scope 1.","Purchased electricity is Scope 2.","Correct. Employee commuting, business travel and purchased goods and services are the manual's Scope 3 examples.","Company-owned vehicles are Scope 1."],
k:"Scope 3 = other indirect emissions from sources NOT owned or controlled by the organisation but tied to its activities. Usually the largest and hardest to measure.",r:"Topic 05: Scope of Carbon Emissions, p.41"},

/*21*/{t:4,m:false,s:"What exactly is a carbon CREDIT?",
o:["A tradeable certificate or permit, usually representing the right to emit 1 tonne of CO2e","Proof that a project removed 1 tonne of CO2e","A government grant for renewable energy","A discount on a company's carbon tax"],a:0,
e:["Correct. A credit is an allowance to emit, issued under a regulated cap-and-trade system.","That describes a carbon OFFSET: proof of a reduction or removal generated by a project.","Not a credit.","Not a credit."],
k:"CREDIT = permit to emit, compliance/regulated market, cap-and-trade. OFFSET = proof of reduction or removal, voluntary market, project-generated. Both are measured in 1 tCO2e.",r:"Topic 05: Carbon Credit v Carbon Offset, p.51"},

/*22*/{t:4,m:false,s:"Carbon offsets are traded in which market?",
o:["The compliance (regulated) market","The voluntary carbon market","The Main Market of Bursa Malaysia","The EU Emissions Trading System"],a:1,
e:["The compliance market is where carbon credits trade.","Correct. Offsets sit in the voluntary carbon market; credits sit in the compliance market.","Bursa's Main Market is an equities market.","The EU ETS is a compliance scheme, so it deals in credits."],
k:"Offset → voluntary market. Credit → compliance market (EU ETS, Bursa Carbon Exchange). This split is the most likely offset/credit question.",r:"Topic 05: Carbon Credit v Carbon Offset, p.51"},

/*23*/{t:4,m:false,s:"Which statement about a Science Based Target (SBT) is correct?",
o:["Offsets are purchased to cover all emissions","No offsets are used for the reduction","It applies only to Scope 1","It requires carbon neutrality in the current year"],a:1,
e:["That describes Carbon Neutral, which relies on buying offsets.","Correct. An SBT commits to reducing emissions along a science-based trajectory, without using offsets for that reduction.","SBTs are not limited to Scope 1.","Carbon neutrality now is a different target type."],
k:"Carbon Neutral = buy offsets to compensate (greenwashing risk if there is no actual reduction). SBT = real reduction on a science-based trajectory, no offsets. Net Zero = stronger commitment than carbon neutral.",r:"Topic 05: Types of Carbon Targets, p.47"},

/*24*/{t:4,m:false,s:"Under SBTi, Scope 3 must be included in the target when it accounts for more than what share of total emissions?",
o:["10%","25%","40%","60%"],a:2,
e:["Too low.","Too low.","Correct. If Scope 3 exceeds 40% of total emissions it falls within SBTi coverage.","Too high; the threshold is 40%."],
k:"SBTi 40% rule. The manual's worked example: Scope 1+2 = 25m tCO2e, Scope 3 = 350m tCO2e, so Scope 3 is 350 of 375m, far above 40% and therefore in scope.",r:"Topic 05: Types of Carbon Targets, p.49"},

/*25*/{t:4,m:false,s:"What is the correct order for calculating a carbon footprint?",
o:["Collect data → define scope → calculate total → convert","Define the scope → collect data → convert data into emissions → calculate the total","Convert data → define scope → collect data → report","Set targets → measure → verify → disclose"],a:1,
e:["Scope must be defined before data collection, or you cannot know what to collect.","Correct. Define the scope, collect data, apply conversion factors to get CO2e, then total it.","Conversion cannot precede collection.","That is the metrics-and-targets cycle, not the footprint calculation."],
k:"Four steps: DEFINE SCOPE → COLLECT DATA → CONVERT using conversion factors → CALCULATE TOTAL in metric tonnes CO2e.",r:"Topic 05: Calculating Carbon Footprint, p.42"},

/*26*/{t:4,m:false,s:"Net Zero is best defined as:",
o:["Emitting no greenhouse gases at all","Achieving a balance between emissions produced and emissions removed","Buying offsets for all current emissions","Reducing emissions by 50% from a base year"],a:1,
e:["Absolute zero emissions is not the definition used.","Correct. Net Zero is a balance, achieved through efficiency, renewables and other measures with removals for the remainder.","That is carbon neutrality.","That is an interim reduction target."],
k:"Net Zero = balance between emitted and removed. It carries a stronger connotation of commitment than Carbon Neutral, even though the terms are often used interchangeably.",r:"Topic 05: Definition of Net Zero, p.43"},

/*27*/{t:5,m:true,s:"What does SASB stand for?",
o:["Sustainability Accounting Standards Board","Social Administration Standards Board","Standards for Administration of Sustainability Board","None of the above"],a:0,
e:["Correct. Sustainability Accounting Standards Board.","Not a real body.","Not a real body.","A is correct, so this cannot be."],
k:"SASB = Sustainability Accounting Standards Board. Its mission is decision-useful disclosure for INVESTORS, built on evidence-based research and industry-specific standards.",r:"Topic 06: The SASB Mission, p.59"},

/*29*/{t:5,m:false,s:"SASB organises sustainability topics into how many broad dimensions?",
o:["Three","Four","Five","Eleven"],a:2,
e:["Too few.","Too few.","Correct. Five: Environment, Social Capital, Human Capital, Business Model & Innovation, and Leadership & Governance.","Eleven is the number of SASB industry SECTORS, not dimensions."],
k:"Five DIMENSIONS, eleven SECTORS. The exam will try to swap these two numbers.",r:"Topic 06: SASB Framework Overview, p.60"},

/*30*/{t:5,m:true,s:"What does Integrated Reporting mean?",
o:["Various parts of the annual report are integrated","The report focuses on business value","Various capitals are reported together","All of the above"],a:3,
e:["True, but incomplete on its own.","True, but incomplete on its own.","True, but incomplete on its own.","Correct. Integrated Reporting combines all three ideas; it shows how a company creates value over time across multiple capitals."],
k:"Integrated Reporting brings financial and sustainability reporting into one report, incorporates social and environmental context, and shows value creation over time across the capitals.",r:"Topic 06: Integrated Reporting, p.64"},

/*31*/{t:5,m:false,s:"ESRS stands for:",
o:["European Sustainability Reporting Standards","ESG Sustainability Rating System","Environmental and Social Risk Standards","European Social Responsibility Statement"],a:0,
e:["Correct. The European Sustainability Reporting Standards, built on a three-layer architecture.","Not a real framework.","Not a real framework.","Not a real framework."],
k:"ESRS = European Sustainability Reporting Standards, the reporting standards under the EU's CSRD, with cross-cutting, sector-specific and entity-specific layers.",r:"Topic 06: ESRS Architecture, p.63"},

/*32*/{t:6,m:false,s:"How many reporting requirements does Bursa Malaysia set out for the Sustainability Statement?",
o:["10","12","14","17"],a:2,
e:["Too few.","Too few.","Correct. The manual sets out 14 Reporting Requirements.","17 is the SDG count, not the Bursa requirement count."],
k:"14 Bursa reporting requirements, running from the Sustainability Statement itself through materiality, stakeholders, risks, governance, scope, KPIs, E/S/G indicators, climate, targets, assurance and reporting format.",r:"Topic 07: The 14 Reporting Requirements, p.79"},

/*34*/{t:6,m:false,s:"Bursa's climate change reporting requirement obliges companies to align disclosures with:",
o:["GRI 305 Emissions","TCFD recommendations","ISO 14064","The Paris Agreement"],a:1,
e:["GRI 305 is an emissions topic standard but not what the Bursa requirement names.","Correct. Requirement 11 requires alignment with TCFD: governance, strategy, risk management, metrics and targets.","ISO 14064 is not the named requirement.","The Paris Agreement is an inter-governmental treaty, not a corporate disclosure framework."],
k:"Bursa Requirement 11 = align with TCFD's four pillars: Governance, Strategy, Risk Management, Metrics and Targets.",r:"Topic 07: 14 Reporting Requirements #11, p.81"},

/*35*/{t:6,m:true,s:"The NSRF's carbon footprint requirements are based on which standard?",
o:["BCRD","ECRS","GRI","ISSB"],a:3,
e:["Not a real standard.","Not a real standard.","GRI is a separate, impact-focused framework, and the NSRF does not build on it.","Correct. The NSRF aligns with the ISSB's IFRS Sustainability Disclosure Standards: IFRS S1 and IFRS S2."],
k:"NSRF → ISSB → IFRS S1 (general) and IFRS S2 (climate). This is the key Malaysia-specific link in the whole syllabus.",r:"Topic 07: National Sustainability Reporting Framework, p.98"},

/*36*/{t:6,m:false,s:"Under the NSRF phased rollout, which entities report first, and from when?",
o:["All Main Market issuers, from 1 January 2025","Main Market issuers with market capitalisation of RM2 billion and above, from 1 January 2025","ACE Market issuers, from 1 January 2026","Non-listed companies with revenue above RM2 billion, from 1 January 2025"],a:1,
e:["Other Main Market issuers follow in 2026, not 2025.","Correct. Group 1 is large Main Market issuers with market cap of RM2 billion or more, starting 1 January 2025.","ACE Market issuers are Group 3, starting 2027.","Large non-listed companies are also Group 3, starting 2027."],
k:"Group 1 (Main Market, market cap ≥ RM2bn) = 2025. Group 2 (other Main Market) = 2026. Group 3 (ACE Market + non-listed with revenue ≥ RM2bn) = 2027.",r:"Topic 07: NSRF Phased Approach, p.100"},

/*37*/{t:6,m:false,s:"What does PACE stand for in the NSRF support initiative?",
o:["Policy, Assumptions, Calculators, Education","Planning, Assurance, Compliance, Evaluation","Paris Agreement Compliance Entity","Performance, Accounting, Carbon, Emissions"],a:0,
e:["Correct. Policy, Assumptions, Calculators and Education, run to help companies adopt the NSRF.","Not the syllabus definition.","Not a real body.","Not the syllabus definition."],
k:"PACE = Policy guidance, Assumptions, Calculators (Scope 1/2/3 emissions tools), Education. Hosted by the Securities Commission Malaysia.",r:"Topic 07: PACE, p.99"},

/*38*/{t:6,m:false,s:"Under the NSRF, what level of assurance is targeted for Scope 1 and Scope 2 GHG emissions, and from when?",
o:["Limited assurance from 2025","Reasonable assurance from 2027","Reasonable assurance from 2030","No assurance is contemplated"],a:1,
e:["The framework aims higher than limited assurance for Scopes 1 and 2.","Correct. The NSRF aims for reasonable assurance on Scope 1 and Scope 2 emissions starting 2027.","2030 is too late relative to the published timeline.","Assurance is explicitly part of the framework."],
k:"Reasonable assurance on Scope 1 and 2 from 2027, provided by both accounting and non-accounting practitioners. The assurance framework remains subject to further consultation.",r:"Topic 07: NSRF Timeline, p.100"},

/*39*/{t:6,m:true,s:"What does IFRS S2 deal with?",
o:["General compliance","Climate-related disclosures, including GHG emissions","GRI compliance","Integrated reporting"],a:1,
e:["General sustainability requirements are IFRS S1, not S2.","Correct. IFRS S2 is the climate standard: transition planning, climate resilience, and Scope 1–3 emissions per the GHG Protocol Corporate Standard.","GRI is a separate framework; IFRS does not certify GRI compliance.","Integrated reporting is a different framework."],
k:"IFRS S1 = general sustainability-related financial disclosures. IFRS S2 = climate. Watch the wording. The mock writes 'IFRS 2', but it means IFRS S2.",r:"Topic 07: IFRS S2 Key Features, p.117"},

/*40*/{t:6,m:false,s:"What are the four pillars of IFRS sustainability reporting?",
o:["Governance, Strategy, Risk Management, Metrics and Targets","Environment, Social, Governance, Economic","Accuracy, Balance, Clarity, Comparability","Policy, Assumptions, Calculators, Education"],a:0,
e:["Correct. IFRS S1 and S2 apply the TCFD structure across these four core content areas.","These are ESG pillars, not the IFRS core content areas.","These are four of the eight GRI reporting principles.","That is the NSRF's PACE initiative."],
k:"Governance, Strategy, Risk Management, Metrics and Targets, the TCFD four pillars, adopted wholesale into IFRS S1 and S2. If a question mentions four pillars in a climate context, this is almost always the answer.",r:"Topic 07: The 4 Pillars of IFRS Reporting, p.105"},

/*41*/{t:6,m:false,s:"IFRS S1's core focus is on which kind of materiality?",
o:["Impact materiality","Financial materiality","Dynamic materiality","Sector materiality"],a:1,
e:["Impact materiality is the GRI approach.","Correct. IFRS S1 is investor-focused: information is material if omitting or misstating it could influence investor decisions.","Dynamic materiality is a WEF/TCFD concept, not the S1 core.","Sector materiality is the SASB approach."],
k:"IFRS S1 = financial materiality, investor-focused, based on the IFRS Accounting Standards definition of material.",r:"Topic 07: IFRS S1 Core Focus, p.107"},

/*42*/{t:7,m:false,s:"What are the three elements of ESG Governance?",
o:["Board, Management, Shareholders","Strategy and Stewardship; Management and Monitoring; Accountability and Assurance","Policy, Process, Performance","Disclose, Assure, Report"],a:1,
e:["These are actors, not the three governance elements.","Correct. Strategy and Stewardship, Management and Monitoring, and Accountability and Assurance.","Not the syllabus wording.","Not the syllabus wording."],
k:"1) Strategy and Stewardship covers director responsibilities, alignment, policies. 2) Management and Monitoring covers governance structure, board oversight, day-to-day management. 3) Accountability and Assurance covers performance, board assurance, audit committee, disclosure assurance.",r:"Topic 08: Three Elements of ESG Governance, p.139"},

/*44*/{t:7,m:false,s:"The audit committee and board's assurance fall under which element of ESG governance?",
o:["Strategy and Stewardship","Management and Monitoring","Accountability and Assurance","None of these; they sit outside ESG governance"],a:2,
e:["Strategy and Stewardship covers director responsibilities, business strategy alignment and policies.","Management and Monitoring covers the ESG governance structure and day-to-day management.","Correct. Accountability and Assurance covers performance, the board's assurance, the audit committee, and assurance over sustainability disclosures.","They are explicitly part of ESG governance."],
k:"Remember the third element by its contents: accountability, board assurance, audit committee, and reporting assurance.",r:"Topic 08: Accountability and Assurance, p.141"},

/*45*/{t:8,m:true,s:"Which GRI series deals with Environmental impacts?",
o:["GRI 200","GRI 300","GRI 400","GRI 500"],a:1,
e:["The 200 series covers Economic topics such as economic performance and anti-corruption.","Correct. The 300 series covers Environmental topics: energy, water, emissions.","The 400 series covers Social topics: employment, child labour, public policy.","There is no 500 series."],
k:"200 = Economic. 300 = Environmental. 400 = Social. There is no 500 series; it is always a distractor.",r:"Topic 09: Topic Standards, p.150"},

/*46*/{t:8,m:true,s:"What does GRI 2 cover?",
o:["The reporting foundation","General disclosures to be made","Material topics","Governance only"],a:1,
e:["That is GRI 1: Foundation 2021.","Correct. GRI 2: General Disclosures 2021 covers the organisation's structure, operations, governance, strategy and stakeholder engagement.","That is GRI 3: Material Topics 2021.","Governance is one section within GRI 2, not the whole standard."],
k:"The three Universal Standards: GRI 1 Foundation (purpose, key concepts, compliance requirements), GRI 2 General Disclosures (context about the organisation), GRI 3 Material Topics (how to identify and manage them).",r:"Topic 09: Universal Standards, p.148"},

/*47*/{t:8,m:true,s:"What is it called when an organisation follows part of the GRI Standards but is not fully compliant?",
o:["GRI Semi Compliant","GRI Partly Compliant","GRI Referenced, reporting 'with reference to' the GRI Standards","GRI Compliant"],a:2,
e:["Not GRI terminology.","Not GRI terminology.","Correct. An organisation that cannot meet all requirements reports 'with reference to' the GRI Standards.","'In accordance with' is the full-compliance claim."],
k:"Two claims only: 'in accordance with' (full) and 'with reference to' (partial). Even a with-reference reporter must publish a GRI content index, provide a statement of use, and notify GRI.",r:"Topic 09: Reporting with Reference, p.168"},

/*48*/{t:8,m:false,s:"In the GRI Standards, a requirement is denoted by which word?",
o:["Should","Shall","May","Must consider"],a:1,
e:["'Should' denotes a recommendation: encouraged but not mandatory.","Correct. 'Shall', shown in bold, denotes a mandatory requirement.","'May' is not used as a GRI signal word.","Not GRI terminology."],
k:"SHALL = requirement (mandatory, bold). SHOULD = recommendation (encouraged). Guidance = separate sections, not mandatory. This wording distinction is highly examinable.",r:"Topic 09: Using the GRI Standards, p.154"},

/*49*/{t:8,m:false,s:"How many requirements must be met to report 'in accordance with' the GRI Standards?",
o:["Five","Seven","Nine","Twelve"],a:2,
e:["Too few.","Too few; seven is where the content index sits, but the list continues.","Correct. Nine requirements, ending with providing a statement of use and notifying GRI.","Too many."],
k:"The nine: 1 apply reporting principles, 2 report GRI 2 disclosures, 3 determine material topics, 4 report GRI 3 disclosures, 5 report topic standard disclosures, 6 give reasons for omission, 7 publish a GRI content index, 8 provide a statement of use, 9 notify GRI.",r:"Topic 09: Reporting in Accordance, p.156"},

/*50*/{t:8,m:false,s:"How many GRI reporting principles are there?",
o:["Four","Six","Eight","Ten"],a:2,
e:["Too few.","Too few.","Correct. Accuracy, balance, clarity, comparability, completeness, sustainability context, timeliness and verifiability.","Too many."],
k:"Eight reporting principles: Accuracy, Balance, Clarity, Comparability, Completeness, Sustainability Context, Timeliness, Verifiability. They are alphabetical, which makes them easier to recall under time pressure.",r:"Topic 09: Reporting Principles, p.163"},

/*51*/{t:8,m:false,s:"For which GRI disclosures are reasons for omission NOT permitted?",
o:["All disclosures allow omission","Disclosures 2-1 to 2-5, plus 3-1 and 3-2","Only the topic standard disclosures","Only sector standard disclosures"],a:1,
e:["Omission is restricted for a specific set.","Correct. Organisational details, entities included, reporting period, restatements, external assurance, the process to determine material topics, and the list of material topics.","Topic standards do allow reasons for omission.","Sector standard topics are handled through the content index."],
k:"No omission allowed for: 2-1 organisational details, 2-2 entities included, 2-3 reporting period/frequency/contact, 2-4 restatements, 2-5 external assurance, 3-1 process to determine material topics, 3-2 list of material topics.",r:"Topic 09: Requirement 6, p.160"},

/*52*/{t:8,m:false,s:"GRI Sector Standards are ultimately planned to cover how many sectors?",
o:["11","17","40","3"],a:2,
e:["11 is the number of SASB industry sectors.","17 is the SDG count.","Correct. Standards will be created for 40 sectors, prioritising those with the most significant impacts.","Three sector standards exist so far (oil and gas, coal, agriculture/aquaculture/fishing), but 40 are planned."],
k:"40 sectors planned; three published so far: GRI 11 Oil and Gas, GRI 12 Coal, GRI 13 Agriculture, Aquaculture and Fishing. Where a Sector Standard exists, using it is mandatory.",r:"Topic 09: Sector Standards, p.149"},

/*53*/{t:9,m:true,s:"When companies pretend to be more environmentally friendly than they actually are, we call that:",
o:["Bluewashing","Cleanwashing","Greenwashing","Whitewashing"],a:2,
e:["Bluewashing is using association with the UN Global Compact to burnish an image.","Not a term used in the syllabus.","Correct. Per ClientEarth, greenwashing creates an illusion of being more environmentally friendly and sustainable than the company truly is.","Not a term used in the syllabus."],
k:"Greenwashing (environment), Social washing (social credentials), Bluewashing (UN Global Compact association). All three appear in Topic 10.",r:"Topic 10: Corporate Greenwashing, p.202"},

/*54*/{t:9,m:false,s:"A company that repeatedly changes its ESG targets before achieving them is engaged in:",
o:["Greenrinsing","Greenhushing","Greencrowding","Greenshifting"],a:0,

k:"Greenrinsing = moving the goalposts. Greenhushing = hiding good news. Greencrowding = safety in numbers. Greenlighting = spotlighting one small green feature. Greenlabelling = misleading 'green' claims. Greenshifting = blaming the consumer.",r:"Topic 10: Types of Greenwashing, p.203"},

/*55*/{t:9,m:false,s:"Bluewashing refers to companies that:",

k:"Bluewashing = trading on UN association. The UN Global Compact was created to bring corporations on board for the MDGs and SDGs; bluewashers join for the badge alone.",r:"Topic 10: Other forms of Washing, p.206"}
];

const PASS = 70, EXAM_SECS = 60*60;
let state = {view:"start", mode:"study", i:0, ans:new Array(Q.length).fill(null),
             flags:new Set(), left:EXAM_SECS, timer:null, revealed:new Set(),
             perm:Q.map(q=>q.o.map((_,k)=>k))};

// Options are shuffled per attempt: the authored key leans heavily on B, and a fixed
// order would teach position-guessing rather than the material. state.ans stores the
// ORIGINAL option index, so scoring against q.a stays correct.
function shuffleOptions(){
  state.perm = Q.map(q=>{
    const p = q.o.map((_,k)=>k);
    for(let k=p.length-1; k>0; k--){
      const j = Math.floor(Math.random()*(k+1));
      [p[k],p[j]] = [p[j],p[k]];
    }
    return p;
  });
}

const app = document.getElementById("app");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const L = ["A","B","C","D"];
const mmss = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const answered = () => state.ans.filter(a=>a!==null).length;
const correctCount = () => state.ans.reduce((n,a,i)=> n + (a===Q[i].a?1:0), 0);

function start(){
  app.innerHTML = `
  <div class="wrap">
    <div class="hero">
      <span class="eyebrow">Certified ESG Reporting Consultant &middot; CCSD Council</span>
      <h1>CERC Mock Exam</h1>
      <p class="lede">Fifty predicted questions built from the CERC course manual, matched to the real paper's format. Every option carries an explanation of why it is right or wrong.</p>
    </div>
    <hr class="rule">
    <div class="facts">
      <div class="fact"><b>50</b><span>Questions</span></div>
      <div class="fact"><b>60:00</b><span>Time limit</span></div>
      <div class="fact"><b>70%</b><span>Pass mark</span></div>
      <div class="fact"><b>35</b><span>Correct needed</span></div>
      <div class="fact"><b>10</b><span>Manual topics</span></div>
    </div>
    <div class="modes">
      <button class="mode primary" onclick="begin('study')">
        <span class="tag">Start here</span>
        <b>Study mode</b>
        <span class="desc">Answer, then see immediately why each option is right or wrong. No timer. Best use of tonight.</span>
        <span class="go">Begin <i>&rarr;</i></span>
      </button>
      <button class="mode secondary" onclick="begin('exam')">
        <b>Exam mode</b>
        <span class="desc">50 questions, 60 minutes, no feedback until you submit. Rehearse the real pacing of 72 seconds per question.</span>
        <span class="go">Start timed run <i>&rarr;</i></span>
      </button>
    </div>
    <div class="note">
      <b>How these questions were chosen</b>
      <span>Questions marked <span class="chip src">mock</span> mirror concepts on the official mock paper, so they are the most likely to reappear. The rest are predictions drawn from the manual's ten topics, weighted by how much space each topic occupies. Bursa/NSRF/IFRS and GRI are the heaviest, so they carry the most questions here.</span>
      <span>Every question cites the manual topic and page it came from, so you can go straight to the source on anything you miss.</span>
    </div>
  </div>`;
}

function begin(mode){
  state.mode = mode; state.view = "run"; state.i = 0;
  state.ans.fill(null); state.flags.clear(); state.revealed.clear();
  shuffleOptions();
  state.left = EXAM_SECS;
  if(state.timer) clearInterval(state.timer);
  if(mode === "exam"){
    state.timer = setInterval(()=>{
      state.left--;
      if(state.left <= 0){ clearInterval(state.timer); finish(); return; }
      const el = document.getElementById("timer");
      if(el){ el.textContent = mmss(state.left); el.classList.toggle("low", state.left < 300); }
    },1000);
  }
  render();
}

function railHTML(reviewing){
  return `<div class="rail">` + Q.map((q,i)=>{
    let c = "tick";
    if(reviewing) c += state.ans[i]===q.a ? " ok" : " no";
    else if(state.mode==="study" && state.revealed.has(i)) c += state.ans[i]===q.a ? " ok" : " no";
    else if(state.ans[i]!==null) c += " done";
    if(state.flags.has(i)) c += " flag";
    if(i===state.i) c += " now";
    return `<button class="${c}" onclick="goto(${i})" title="Question ${i+1}" aria-label="Question ${i+1}"></button>`;
  }).join("") + `</div>`;
}

function render(){
  const q = Q[state.i], i = state.i;
  const reviewing = state.view === "review";
  const show = reviewing || (state.mode === "study" && state.revealed.has(i));
  const picked = state.ans[i];

  const opts = state.perm[i].map((orig,k)=>{
    let cls = "opt";
    let why = "";
    if(show){
      if(orig === q.a) cls += " correct";
      else if(orig === picked) cls += " wrong";
      if(orig === picked) cls += " picked";
      const good = orig === q.a;
      why = `<span class="why"><span class="verdict ${good?"y":"n"}">${good?"Correct":"Why not"}</span>${esc(q.e[orig])}</span>`;
    } else if(orig === picked) cls += " correct picked";
    return `<button class="${cls}" ${show?"disabled":""} onclick="pick(${orig})">
      <span class="ltr">${L[k]}</span>
      <span class="otext">${esc(q.o[orig])}${why}</span></button>`;
  }).join("");

  app.innerHTML = `
  <div class="bar"><div class="bar-in">
    <div class="bar-row">
      <div class="bar-left">
        <span class="bar-title">${reviewing ? "Review" : (state.mode==="exam" ? "Exam mode" : "Study mode")}</span>
        ${state.mode==="exam" && !reviewing ? `<span class="timer" id="timer">${mmss(state.left)}</span>` : ""}
      </div>
      <div class="bar-right">
        <span class="num count">${answered()}/${Q.length} answered</span>
        ${reviewing ? "" : `<button class="mini ${state.flags.has(i)?"on":""}" onclick="flag()">${state.flags.has(i)?"Flagged":"Flag"}</button>`}
        ${reviewing ? `<button class="mini" onclick="results()">Score</button>` : `<button class="mini" onclick="finish()">Submit</button>`}
      </div>
    </div>
    ${railHTML(reviewing)}
  </div></div>

  <div class="wrap">
    <div class="qhead">
      <span class="num">Question ${i+1} of ${Q.length}</span>
      <span class="chip">${esc(TOPICS[q.t])}</span>
      ${q.m ? `<span class="chip src">mock</span>` : ""}
    </div>
    <h2 class="stem">${esc(q.s)}</h2>
    <div class="opts">${opts}</div>
    ${show ? `<div class="key">
        <span class="eyebrow">Key point</span>
        <p>${esc(q.k)}<span class="ref">${esc(q.r)}</span></p>
      </div>` : ""}
    <div class="nav">
      <button class="btn ghost" onclick="move(-1)" ${i===0?"disabled":""}>Previous</button>
      <button class="btn" onclick="move(1)" ${i===Q.length-1?"disabled":""}>Next</button>
      <span class="spacer"></span>
      ${i===Q.length-1 && !reviewing ? `<button class="btn" onclick="finish()">Finish</button>` : ""}
    </div>
  </div>`;
}

function pick(k){
  state.ans[state.i] = k;
  if(state.mode === "study") state.revealed.add(state.i);
  render();
}
function flag(){ state.flags.has(state.i) ? state.flags.delete(state.i) : state.flags.add(state.i); render(); }
function move(d){ const n = state.i + d; if(n>=0 && n<Q.length){ state.i = n; render(); window.scrollTo(0,0);} }
function goto(n){ state.i = n; render(); window.scrollTo(0,0); }
function finish(){ if(state.timer) clearInterval(state.timer); results(); }

function results(){
  state.view = "results";
  const c = correctCount(), pct = Math.round(c/Q.length*100), passed = pct >= PASS;
  const byTopic = TOPICS.map((name,t)=>{
    const idx = Q.map((q,i)=>q.t===t?i:-1).filter(x=>x>=0);
    const got = idx.filter(i=>state.ans[i]===Q[i].a).length;
    return {name, got, tot:idx.length};
  }).sort((a,b)=> (a.got/a.tot) - (b.got/b.tot));

  const weak = byTopic.filter(r=>r.got/r.tot < 0.7);

  app.innerHTML = `
  <div class="wrap">
    <div class="hero" style="padding-bottom:8px">
      <span class="eyebrow">Result &middot; ${state.mode==="exam"?"Exam mode":"Study mode"}</span>
      <div class="score">
        <b class="${passed?"pass":"fail"}">${pct}%</b>
        <span class="verdictbig ${passed?"pass":"fail"}">${passed?"Pass":"Below pass mark"}</span>
      </div>
      <p class="lede">${c} of ${Q.length} correct. The real exam needs 35 of 50 to pass.</p>
    </div>

    <div class="meter">
      <i class="${passed?"":"fail"}" style="width:${pct}%"></i>
      <span class="passline" style="left:${PASS}%"></span>
    </div>
    <div class="meterlab"><span>0%</span><span>70% pass mark</span><span>100%</span></div>

    <div class="tablewrap"><table class="breakdown">
      <thead><tr><th>Topic</th><th>Score</th></tr></thead>
      <tbody>${byTopic.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.got}/${r.tot}</td></tr>`).join("")}</tbody>
    </table></div>

    ${weak.length ? `<div class="note" style="margin-top:24px">
      <b>Revise these first</b>
      <span>${weak.map(r=>esc(r.name)).join(" &middot; ")}</span>
      <span>Open the review below; each question you missed cites the exact manual topic and page.</span>
    </div>` : `<div class="note" style="margin-top:24px">
      <b>Every topic above 70%</b>
      <span>Run it again in exam mode to rehearse the 60-minute pacing, then get some sleep.</span>
    </div>`}

    <div class="nav">
      <button class="btn" onclick="review()">Review all 50</button>
      <button class="btn ghost" onclick="start()">Start over</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

function review(){ state.view = "review"; state.i = 0; render(); window.scrollTo(0,0); }

start();
</script>

</body>
</html>
