s dominated by Use of Sold Products. In the example that was 350m of 375m tCO2e total.","r":"Topic 05: Scope 3 Target Example, p.49","d":2},{"t":4,"p":0,"s":"Which carbon target type involves purchasing offsets for all emissions now AND committing to a science-based trajectory?","o":["Carbon Neutral only","Science Based Target only","SBT plus Net Zero by a target date","Carbon Neutral now plus SBT plus Net Zero by a target date"],"a":3,"e":["Carbon Neutral alone does not include an SBT.","An SBT alone uses no offsets for the reduction.","That uses offsets only for remaining emissions, not all emissions now.","Correct."],"k":"Four target types: Carbon Neutral (Scope 1,2), SBT, SBT + Net Zero by a date, and Carbon Neutral now + SBT + Net Zero by a date.","r":"Topic 05: Type of Carbon Targets, p.48","d":2},{"t":4,"p":0,"s":"Which is a Technical Removal offset project?","o":["Reforestation","Direct Air Capture","Methane capture from landfill","Improved cookstoves"],"a":1,"e":["Forestry and land use.","Correct. Technology that directly captures CO2 from the atmosphere.","Methane capture is its own category.","A community project."],"k":"Offset project types: renewable energy, energy efficiency, methane capture, community projects, forestry and land use, agriculture, technical removals, waste management.","r":"Topic 05: Carbon Offset Projects, p.51","d":2},{"t":4,"p":0,"s":"Planting trees in areas that were NOT previously forested is called:","o":["Reforestation","Afforestation","Conservation","Agroforestry"],"a":1,"e":["Reforestation is replanting areas that were previously deforested.","Correct.","Conservation protects existing forests from logging or degradation.","Agroforestry combines trees with crops or livestock."],"k":"Reforestation = replant where forest was lost. Afforestation = plant where there was no forest. Conservation = protect existing. Agroforestry = trees with crops or livestock.","r":"Topic 05: Carbon Offset Projects, p.51","d":2},{"t":4,"p":0,"s":"A carbon credit usually represents the right to emit how much?","o":["1 kilogram of CO2e","1 tonne of CO2e","100 tonnes of CO2e","It varies by country"],"a":1,"e":["Too small.","Correct.","Too large.","The unit is standardised at 1 tonne."],"k":"Both credits and offsets use a 1 tonne CO2e unit: a credit is 1 tCO2e of allowance, an offset is 1 tCO2e reduced or removed.","r":"Topic 05: Carbon Credit v Carbon Offset, p.51","d":2},{"t":4,"p":0,"s":"Which is named as a planned Malaysian compliance carbon market?","o":["Bursa Carbon Exchange","Malaysia Green Exchange","ASEAN Carbon Board","Kuala Lumpur Emissions Market"],"a":0,"e":["Correct, cited alongside the EU ETS as a compliance market.","Not named.","Not named.","Not named."],"k":"Compliance markets named: the EU Emissions Trading System and Malaysia's planned Bursa Carbon Exchange.","r":"Topic 05: Carbon Credit, p.50","d":2},{"t":4,"p":0,"s":"Which of these is NOT listed as a benefit of Net Zero?","o":["Improving air quality","Reducing dependence on fossil fuels","Creating new economic opportunities","Eliminating the need for sustainability reporting"],"a":3,"e":["A listed benefit.","A listed benefit.","A listed benefit, such as growth in renewable energy industries.","Correct. Not a benefit claimed anywhere."],"k":"Benefits: new economic opportunities, improved air quality, reduced fossil fuel dependence, reduced climate change impacts.","r":"Topic 05: Benefits of Net Zero, p.46","d":2},{"t":5,"p":1,"s":"How many industry sectors do the SASB Standards address?","o":["Five","Nine","Eleven","Seventeen"],"a":2,"e":["Five is the number of SASB dimensions.","Not the count.","Correct.","17 is the SDG count."],"k":"11 SASB sectors: Consumer Goods, Extractives & Minerals Processing, Financials, Food & Beverage, Health Care, Infrastructure, Renewable Resources & Alternative Energy, Resource Transformation, Services, Technology & Communications, Transportation.","r":"Topic 06: The 11 Sectors, p.61","d":2},{"t":5,"p":0,"s":"Which is NOT one of the four components of the SASB Standards?","o":["Disclosure Topics","Accounting Metrics","Technical Protocols","Assurance Opinions"],"a":3,"e":["A component.","A component.","A component providing guidance on definitions, scope, implementation and presentation.","Correct. The fourth is Activity Metrics."],"k":"SASB components: Disclosure Topics, Accounting Metrics, Technical Protocols, Activity Metrics. Activity metrics normalise data to make comparison possible.","r":"Topic 06: SASB Standards, p.61","d":2},{"t":5,"p":1,"s":"How many capitals does the Integrated Reporting value creation model rely on?","o":["Four","Five","Six","Eight"],"a":2,"e":["Too few.","Too few.","Correct.","Too many."],"k":"Six capitals: Financial, Manufactured, Intellectual, Human, Social and Relationship, Natural.","r":"Topic 06: The Six capitals, p.76","d":2},{"t":5,"p":0,"s":"In the Integrated Reporting business model, 'Outcomes' are:","o":["The products and services produced","The internal and external consequences of the outputs and activities on the capitals","The resources the organisation uses","The organisation's strategic actions"],"a":1,"e":["Those are Outputs.","Correct.","Those are Inputs.","Those are Business Activities."],"k":"Inputs (the six capitals) to Business Activities to Outputs (products, services, by-products, waste) to Outcomes (consequences on the capitals).","r":"Topic 06: The Business Model for Value Creation, p.76","d":2},{"t":5,"p":0,"s":"Which capital covers knowledge-based intangibles such as patents and brand reputation?","o":["Manufactured Capital","Intellectual Capital","Human Capital","Social and Relationship Capital"],"a":1,"e":["Physical objects such as buildings and machinery.","Correct. Intellectual property, systems, procedures and brand reputation.","People's competencies, capabilities, experience and motivations.","Institutions, relationships, shared norms and trust with stakeholders."],"k":"Financial (funds), Manufactured (physical), Intellectual (intangibles), Human (people), Social and Relationship (trust and relationships), Natural (environmental stocks).","r":"Topic 06: The Six capitals, p.76","d":2},{"t":6,"p":0,"s":"Under the NSRF, which group begins reporting on 1 January 2026?","o":["Main Market issuers with market cap of RM2 billion and above","Main Market issuers other than those in Group 1","ACE Market listed issuers","Non-listed companies with revenue above RM2 billion"],"a":1,"e":["That is Group 1, starting 2025.","Correct. Group 2.","Group 3, starting 2027.","Group 3, starting 2027."],"k":"Group 1 (Main Market, cap RM2bn+) 2025. Group 2 (other Main Market) 2026. Group 3 (ACE Market plus non-listed with revenue RM2bn+) 2027.","r":"Topic 07: NSRF Phased Approach, p.100","d":2},{"t":6,"p":1,"s":"Under the NSRF, what assurance level is targeted for Scope 1 and Scope 2 emissions, and from when?","o":["Limited assurance from 2025","Reasonable assurance from 2027","Reasonable assurance from 2030","No assurance is contemplated"],"a":1,"e":["The framework aims higher.","Correct.","Too late relative to the published timeline.","Assurance is explicitly part of the framework."],"k":"Reasonable assurance on Scope 1 and 2 from 2027, by accounting and non-accounting practitioners. The framework remains subject to further consultation.","r":"Topic 07: NSRF Timeline, p.100","d":2},{"t":6,"p":0,"s":"What does PACE stand for in the NSRF support initiative?","o":["Policy, Assumptions, Calculators, Education","Planning, Assurance, Compliance, Evaluation","Paris Agreement Compliance Entity","Performance, Accounting, Carbon, Emissions"],"a":0,"e":["Correct.","Not the definition.","Not a real body.","Not the definition."],"k":"PACE = Policy guidance, Assumptions, Calculators (Scope 1, 2, 3 tools), Education. Hosted by the Securities Commission Malaysia.","r":"Topic 07: PACE, p.99","d":2},{"t":6,"p":0,"s":"How long do the NSRF's additional transition reliefs last for Group 3 entities?","o":["1 year","2 years","3 years","5 years"],"a":2,"e":["Too short.","That is the duration for Groups 1 and 2.","Correct. Group 3 gets 3 years.","Too long."],"k":"Transition reliefs: 2 years for Groups 1 and 2, 3 years for Group 3. They cover the climate-first approach, principal business segments, and omitting Scope 3.","r":"Topic 07: NSRF Proportionality, p.101","d":2},{"t":6,"p":0,"s":"Which is NOT one of the NSRF's proportionality mechanisms?","o":["Climate-first approach","Focus on principal business segments","In-built proportionality mechanisms","Exemption from external assurance forever"],"a":3,"e":["A listed mechanism.","A listed mechanism.","A listed mechanism.","Correct. Assurance is part of the framework, not permanently waived."],"k":"Proportionality: climate-first approach, in-built mechanisms, focus on principal business segments, and relief on Scope 3 GHG emissions.","r":"Topic 07: NSRF Proportionality, p.100","d":2},{"t":6,"p":0,"s":"Under IFRS S2, GHG emissions must be disclosed in accordance with which standard?","o":["ISO 14064","The GHG Protocol Corporate Standard","GRI 305","The Paris Agreement"],"a":1,"e":["Not the standard named.","Correct.","A GRI topic standard, not the IFRS S2 basis.","A treaty, not a measurement standard."],"k":"IFRS S2 key features: transition planning, emissions targets and use of carbon offsets, climate resilience via scenario analysis, and Scope 1 to 3 emissions per the GHG Protocol Corporate Standard.","r":"Topic 07: IFRS S2 Key Features, p.117","d":2},{"t":6,"p":0,"s":"Under IFRS S2's Metrics and Targets, industry-specific metrics are based on which standards?","o":["GRI Standards","SASB Standards","ISO Standards","ESRS"],"a":1,"e":["GRI is a separate framework.","Correct.","Not the basis.","Not the basis."],"k":"IFRS S2 metrics: cross-industry metrics including GHG emissions, industry-specific metrics based on SASB Standards, and new proposed metrics including financed emissions.","r":"Topic 07: IFRS S2, p.118","d":2},{"t":6,"p":0,"s":"Bursa requires indicators for material sustainability matters to be disclosed with data covering how many financial years?","o":["The current year only","The last 2 financial years","The last 3 financial years","The last 5 financial years"],"a":2,"e":["Insufficient for comparability.","Not the requirement.","Correct, together with performance targets where set.","Not the requirement."],"k":"Indicators must come with data for the last 3 financial years, plus performance targets in relation to those indicators if targets are set.","r":"Topic 07: Manage Material Sustainability Matters, p.92","d":2},{"t":6,"p":0,"s":"When disclosing a Metric, which of these must be included?","o":["Description, units of measurement, methodology and sources","Only the number","The auditor's name","The board's approval date"],"a":0,"e":["Correct, plus any further references.","Insufficient.","Not required.","Not required."],"k":"Metric disclosure: description of the metric, units of measurement, methodology, sources, and any further references.","r":"Topic 07: Disclosure of Metrics, p.95","d":2},{"t":7,"p":0,"s":"In ESG governance, 'Management and Monitoring' covers which of these?","o":["The audit committee","Governance structure for ESG, board oversight and delegation, and day-to-day sustainability management","Director's responsibilities and policies","External assurance conclusions"],"a":1,"e":["That sits under Accountability and Assurance.","Correct.","That sits under Strategy and Stewardship.","That sits under Accountability and Assurance."],"k":"Element 2 Management and Monitoring: governance structure for ESG, board oversight and delegation of ESG management, day-to-day sustainability management.","r":"Topic 08: Management and Monitoring, p.140","d":2},{"t":7,"p":0,"s":"What phrase does the manual use to close the ESG governance topic?","o":["One size does not fit all","Trust but verify","Comply or explain","Substance over form"],"a":0,"e":["Correct. Governance arrangements must suit the organisation.","Not used here.","A corporate governance phrase, but not the one used.","An accounting principle."],"k":"'One size does not fit all.' ESG governance structures must be proportionate to the organisation.","r":"Topic 08: One size does not fit all, p.141","d":2},{"t":8,"p":1,"s":"How many requirements must be met to report 'in accordance with' the GRI Standards?","o":["Five","Seven","Nine","Twelve"],"a":2,"e":["Too few.","Seven is where the content index sits, but the list continues.","Correct.","Too many."],"k":"Nine: apply reporting principles, report GRI 2, determine material topics, report GRI 3, report topic standard disclosures, give reasons for omission, publish a content index, provide a statement of use, notify GRI.","r":"Topic 09: Reporting in Accordance, p.156","d":2},{"t":8,"p":1,"s":"How many GRI reporting principles are there?","o":["Four","Six","Eight","Ten"],"a":2,"e":["Too few.","Too few.","Correct.","Too many."],"k":"Eight: Accuracy, Balance, Clarity, Comparability, Completeness, Sustainability Context, Timeliness, Verifiability. They are listed alphabetically.","r":"Topic 09: Reporting Principles, p.163","d":2},{"t":8,"p":0,"s":"For which GRI disclosures are reasons for omission NOT permitted?","o":["All disclosures allow omission","Disclosures 2-1 to 2-5, plus 3-1 and 3-2","Only the topic standard disclosures","Only sector standard disclosures"],"a":1,"e":["Omission is restricted for a specific set.","Correct.","Topic standards do allow reasons for omission.","Handled through the content index."],"k":"No omission for 2-1 organisational details, 2-2 entities included, 2-3 reporting period, 2-4 restatements, 2-5 external assurance, 3-1 process to determine material topics, 3-2 list of material topics.","r":"Topic 09: Requirement 6, p.160","d":2},{"t":8,"p":0,"s":"GRI Sector Standards are ultimately planned to cover how many sectors?","o":["11","17","40","3"],"a":2,"e":["11 is the SASB sector count.","17 is the SDG count.","Correct, prioritising those with the most significant impacts.","Three are published so far, but 40 are planned."],"k":"40 sectors planned. Three published: GRI 11 Oil and Gas, GRI 12 Coal, GRI 13 Agriculture, Aquaculture and Fishing. Using an available Sector Standard is mandatory.","r":"Topic 09: Sector Standards, p.149","d":2},{"t":8,"p":0,"s":"How many steps does GRI 3 set out for determining material topics?","o":["Three","Four","Five","Nine"],"a":1,"e":["Too few.","Correct.","Too many.","Nine is the count of in-accordance requirements."],"k":"GRI 3 four steps: understand the organisation's context, identify actual and potential impacts, assess the significance of the impacts, prioritise the most significant for reporting.","r":"Topic 09: GRI 3 Material Topics, p.189","d":2},{"t":8,"p":0,"s":"Which GRI 3 disclosure covers the management of material topics?","o":["Disclosure 3-1","Disclosure 3-2","Disclosure 3-3","Disclosure 2-5"],"a":2,"e":["3-1 is the process to determine material topics.","3-2 is the list of material topics.","Correct. 3-3 Management of material topics.","2-5 is external assurance."],"k":"3-1 process to determine material topics, 3-2 list of material topics, 3-3 management of material topics.","r":"Topic 09: Disclosures on Material Topics, p.190","d":2},{"t":8,"p":0,"s":"When was the GRI permanently established in Amsterdam?","o":["1997","1999","2002","2021"],"a":2,"e":["1997 is when GRI was set up.","1999 is when it launched its reporting standards.","Correct.","2021 is the year of the current Universal Standards."],"k":"GRI set up 1997, permanently established in Amsterdam 2002, standards launched 1999. Over 10,000 companies report using GRI across more than 100 countries.","r":"Topic 09: The GRI Standards, p.143","d":2},{"t":8,"p":0,"s":"Reporting under the GRI Standards is:","o":["Mandatory for all listed companies worldwide","Voluntary","Mandatory in Malaysia","Required by the ISSB"],"a":1,"e":["GRI has no legal force of its own.","Correct, though it is the de facto world standard on sustainability reporting.","Bursa mandates a Sustainability Statement, not GRI specifically.","The ISSB refers to GRI only as additional guidance."],"k":"GRI reporting is voluntary. It is described as the 'de facto' world standard, holding that position in fact rather than by legal right.","r":"Topic 09: The Global Reporting Initiative, p.144","d":2},{"t":9,"p":0,"s":"Greenhushing is best described as:","o":["Quietly exceeding climate targets","Under-reporting or hiding sustainability credentials to evade investor scrutiny","Silencing critics of a company's ESG record","Publishing a report without a press release"],"a":1,"e":["Not the definition.","Correct.","Not the definition.","Not the definition."],"k":"Greenhushing is the mirror image of greenwashing: the company understates rather than overstates. Still a disclosure failure.","r":"Topic 10: Types of Greenwashing, p.203","d":2},{"t":9,"p":0,"s":"Greencrowding relies on which belief?","o":["That consumers will not check claims","That you can hide in a crowd to avoid discovery, relying on safety in numbers","That regulators move slowly","That offsets solve everything"],"a":1,"e":["Closer to false claims.","Correct, and the group tends to move at the speed of its slowest member.","Not the definition.","Not the definition."],"k":"Greencrowding: hiding in a group. Greenlighting: spotlighting one small green feature to distract. Greenlabelling: misleading 'green' claims on inspection.","r":"Topic 10: Types of Greenwashing, p.203","d":2}];
let Q = [];

const PASS = 70, EXAM_SECS = 60*60;
let state = {view:"start", mode:"study", i:0, ans:new Array(Q.length).fill(null),
             flags:new Set(), left:EXAM_SECS, timer:null, revealed:new Set(),
             perm:[], tier:null};

// Options are shuffled per attempt: the authored key leans heavily on B, and a fixed
// order would teach position-guessing rather than the material. state.ans stores the
// ORIGINAL option index, so scoring against q.a stays correct.
function shuffleOptions(){
  state.perm = Q.map(q=>{
    const p = q.o.map((_,k)=>k);
    for(let k=p.length-1; k>0; k--){
      const j = Math.floor(Math.random()*(k+1));
      [p[k],p[j]] = [p[j],p[k]];
    }
    return p;
  });
}

const app = document.getElementById("app");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const L = ["A","B","C","D"];
const mmss = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const answered = () => state.ans.filter(a=>a!==null).length;
const correctCount = () => state.ans.reduce((n,a,i)=> n + (a===Q[i].a?1:0), 0);

const TIERS = [
  {key:0, name:"Easy",   dots:"●○○", blurb:"Definitions, acronyms and single facts. Start here to warm up."},
  {key:1, name:"Medium", dots:"●●○", blurb:"How the concepts connect: which framework, which list, which order."},
  {key:2, name:"Hard",   dots:"●●●", blurb:"Exact numbers, dates and fine distinctions. Still recall, just deeper."}
];

function start(){
  state.view = "start";
  if(state.timer) clearInterval(state.timer);
  app.innerHTML = `
  <div class="wrap">
    <div class="hero">
      <span class="eyebrow">Certified ESG Reporting Consultant &middot; CCSD Council</span>
      <h1>CERC Mock Exam</h1>
      <p class="lede">150 questions drawn from the CERC course manual, graded into three tiers of 50. Every option carries an explanation of why it is right or wrong.</p>
    </div>
    <hr class="rule">
    <div class="facts">
      <div class="fact"><b>150</b><span>Questions in total</span></div>
      <div class="fact"><b>3&times;50</b><span>Easy, medium, hard</span></div>
      <div class="fact"><b>60:00</b><span>Exam time limit</span></div>
      <div class="fact"><b>70%</b><span>Pass mark</span></div>
      <div class="fact"><b>10</b><span>Manual topics</span></div>
    </div>

    <span class="eyebrow sect">Study mode &middot; pick a tier</span>
    <div class="tiers">
      ${TIERS.map(t=>`
        <button class="mode tier" onclick="begin('study',${t.key})">
          <span class="dots">${t.dots}</span>
          <b>${t.name}</b>
          <span class="desc">${t.blurb}</span>
          <span class="go">50 questions <i>&rarr;</i></span>
        </button>`).join("")}
    </div>

    <span class="eyebrow sect">Exam mode &middot; the predicted paper</span>
    <button class="mode primary wide" onclick="begin('exam')">
      <span class="tag">Predicted</span>
      <b>Sit the predicted exam</b>
      <span class="desc">The 50 questions most likely to appear, pulled from all three tiers and weighted toward the straightforward recall the trainer described. 60 minutes, no feedback until you submit.</span>
      <span class="go">Start timed run <i>&rarr;</i></span>
    </button>

    <div class="note">
      <b>How the predicted paper was built</b>
      <span>28 easy, 16 medium and 6 hard questions, matching a straightforward paper rather than a difficult one. It includes every concept that appears on the official mock, since those are the likeliest to reappear.</span>
      <span>Each question cites the manual topic and page it came from, so you can go straight to the source on anything you miss.</span>
    </div>
  </div>`;
}

function begin(mode, tier){
  state.mode = mode; state.view = "run"; state.i = 0;
  state.tier = (mode === "exam") ? null : tier;
  Q = (mode === "exam") ? ALL.filter(q=>q.p) : ALL.filter(q=>q.d === tier);
  state.ans = new Array(Q.length).fill(null);
  state.ans.fill(null); state.flags.clear(); state.revealed.clear();
  shuffleOptions();
  state.left = EXAM_SECS;
  if(state.timer) clearInterval(state.timer);
  if(mode === "exam"){
    state.timer = setInterval(()=>{
      state.left--;
      if(state.left <= 0){ clearInterval(state.timer); finish(); return; }
      const el = document.getElementById("timer");
      if(el){ el.textContent = mmss(state.left); el.classList.toggle("low", state.left < 300); }
    },1000);
  }
  render();
}

function railHTML(reviewing){
  return `<div class="rail">` + Q.map((q,i)=>{
    let c = "tick";
    if(reviewing) c += state.ans[i]===q.a ? " ok" : " no";
    else if(state.mode==="study" && state.revealed.has(i)) c += state.ans[i]===q.a ? " ok" : " no";
    else if(state.ans[i]!==null) c += " done";
    if(state.flags.has(i)) c += " flag";
    if(i===state.i) c += " now";
    return `<button class="${c}" onclick="goto(${i})" title="Question ${i+1}" aria-label="Question ${i+1}"></button>`;
  }).join("") + `</div>`;
}

function render(){
  const q = Q[state.i], i = state.i;
  const reviewing = state.view === "review";
  const show = reviewing || (state.mode === "study" && state.revealed.has(i));
  const picked = state.ans[i];

  const opts = state.perm[i].map((orig,k)=>{
    let cls = "opt";
    let why = "";
    if(show){
      if(orig === q.a) cls += " correct";
      else if(orig === picked) cls += " wrong";
      if(orig === picked) cls += " picked";
      const good = orig === q.a;
      why = `<span class="why"><span class="verdict ${good?"y":"n"}">${good?"Correct":"Why not"}</span>${esc(q.e[orig])}</span>`;
    } else if(orig === picked) cls += " correct picked";
    return `<button class="${cls}" ${show?"disabled":""} onclick="pick(${orig})">
      <span class="ltr">${L[k]}</span>
      <span class="otext">${esc(q.o[orig])}${why}</span></button>`;
  }).join("");

  app.innerHTML = `
  <div class="bar"><div class="bar-in">
    <div class="bar-row">
      <div class="bar-left">
        <span class="bar-title">${reviewing ? "Review" : (state.mode==="exam" ? "Predicted exam" : TIERS[state.tier].name+" tier")}</span>
        ${state.mode==="exam" && !reviewing ? `<span class="timer" id="timer">${mmss(state.left)}</span>` : ""}
      </div>
      <div class="bar-right">
        <span class="num count">${answered()}/${Q.length} answered</span>
        ${reviewing ? "" : `<button class="mini ${state.flags.has(i)?"on":""}" onclick="flag()">${state.flags.has(i)?"Flagged":"Flag"}</button>`}
        ${reviewing ? `<button class="mini" onclick="results()">Score</button>` : `<button class="mini" onclick="finish()">Submit</button>`}
      </div>
    </div>
    ${railHTML(reviewing)}
  </div></div>

  <div class="wrap">
    <div class="qhead">
      <span class="num">Question ${i+1} of ${Q.length}</span>
      <span class="chip">${esc(TOPICS[q.t])}</span>
      ${q.m ? `<span class="chip src">mock</span>` : ""}
    </div>
    <h2 class="stem">${esc(q.s)}</h2>
    <div class="opts">${opts}</div>
    ${show ? `<div class="key">
        <span class="eyebrow">Key point</span>
        <p>${esc(q.k)}<span class="ref">${esc(q.r)}</span></p>
      </div>` : ""}
    <div class="nav">
      <button class="btn ghost" onclick="move(-1)" ${i===0?"disabled":""}>Previous</button>
      <button class="btn" onclick="move(1)" ${i===Q.length-1?"disabled":""}>Next</button>
      <span class="spacer"></span>
      ${i===Q.length-1 && !reviewing ? `<button class="btn" onclick="finish()">Finish</button>` : ""}
    </div>
  </div>`;
}

function pick(k){
  state.ans[state.i] = k;
  if(state.mode === "study") state.revealed.add(state.i);
  render();
}
function flag(){ state.flags.has(state.i) ? state.flags.delete(state.i) : state.flags.add(state.i); render(); }
function move(d){ const n = state.i + d; if(n>=0 && n<Q.length){ state.i = n; render(); window.scrollTo(0,0);} }
function goto(n){ state.i = n; render(); window.scrollTo(0,0); }
function finish(){ if(state.timer) clearInterval(state.timer); results(); }

function results(){
  state.view = "results";
  const c = correctCount(), pct = Math.round(c/Q.length*100), passed = pct >= PASS;
  const byTopic = TOPICS.map((name,t)=>{
    const idx = Q.map((q,i)=>q.t===t?i:-1).filter(x=>x>=0);
    const got = idx.filter(i=>state.ans[i]===Q[i].a).length;
    return {name, got, tot:idx.length};
  }).sort((a,b)=> (a.got/a.tot) - (b.got/b.tot));

  const weak = byTopic.filter(r=>r.got/r.tot < 0.7);

  app.innerHTML = `
  <div class="wrap">
    <div class="hero" style="padding-bottom:8px">
      <span class="eyebrow">Result &middot; ${state.mode==="exam"?"Predicted exam":TIERS[state.tier].name+" tier"}</span>
      <div class="score">
        <b class="${passed?"pass":"fail"}">${pct}%</b>
        <span class="verdictbig ${passed?"pass":"fail"}">${passed?"Pass":"Below pass mark"}</span>
      </div>
      <p class="lede">${c} of ${Q.length} correct. The real exam needs 35 of 50 to pass.</p>
    </div>

    <div class="meter">
      <i class="${passed?"":"fail"}" style="width:${pct}%"></i>
      <span class="passline" style="left:${PASS}%"></span>
    </div>
    <div class="meterlab"><span>0%</span><span>70% pass mark</span><span>100%</span></div>

    <div class="tablewrap"><table class="breakdown">
      <thead><tr><th>Topic</th><th>Score</th></tr></thead>
      <tbody>${byTopic.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.got}/${r.tot}</td></tr>`).join("")}</tbody>
    </table></div>

    ${weak.length ? `<div class="note" style="margin-top:24px">
      <b>Revise these first</b>
      <span>${weak.map(r=>esc(r.name)).join(" &middot; ")}</span>
      <span>Open the review below; each question you missed cites the exact manual topic and page.</span>
    </div>` : `<div class="note" style="margin-top:24px">
      <b>Every topic above 70%</b>
      <span>Run it again in exam mode to rehearse the 60-minute pacing, then get some sleep.</span>
    </div>`}

    <div class="nav">
      <button class="btn" onclick="review()">Review all ${Q.length}</button>
      <button class="btn ghost" onclick="start()">Start over</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

function review(){ state.view = "review"; state.i = 0; render(); window.scrollTo(0,0); }

start();
</script>

</body>
</html>
