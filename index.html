<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="CERC mock exam: 150 questions in easy, medium and hard tiers, plus a predicted 50-question paper. Every option explained.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128203;</text></svg>">
<title>CERC Mock Exam</title>
<style>
  :root{
    --paper:#FFFFFF; --card:#FFFFFF; --card-2:#EFF4F4;
    --ink:#101D1C; --ink-2:#3A4C4B; --muted:#6B7C7B; --line:#DDE6E6;
    --accent:#0F5C57; --accent-soft:#E3F0EE; --accent-ink:#0B3F3B; --on-accent:#FFFFFF;
    --ok:#1C7A4A; --ok-soft:#E4F4EA; --no:#A8352F; --no-soft:#FBE8E6;
    --flag:#8F6410; --flag-soft:#F9F0DB;
    /* gloss: a lifted white surface reads as sheen, not a grey card on a grey ground */
    --gloss:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(16,29,28,.05), 0 12px 28px -20px rgba(16,29,28,.28);
    --gloss-hi:0 1px 0 rgba(255,255,255,.85);
    --font-display:Georgia,"Iowan Old Style","Times New Roman",serif;
    --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r:12px;
  }

  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); min-height:100vh;
    background:var(--paper);
    background-image:
      radial-gradient(120% 60% at 50% -10%, rgba(15,92,87,.07) 0%, rgba(15,92,87,0) 60%),
      linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 55%, #F3F8F8 100%);
    background-attachment:fixed; background-repeat:no-repeat;
    font-family:var(--font-ui); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  }
  .wrap{max-width:780px; margin:0 auto; padding:0 20px 88px}
  h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0}
  p{margin:0}
  button{font-family:inherit; font-size:inherit; cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);
  }

  /* ---------- start ---------- */
  .hero{padding:64px 0 32px; display:flex; flex-direction:column; gap:18px}
  .hero h1{font-size:clamp(34px,6vw,50px); line-height:1.08; letter-spacing:-.02em}
  .hero .lede{color:var(--ink-2); font-size:17px; max-width:60ch}
  .rule{height:1px; background:var(--line); border:0; margin:0}

  .facts{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr));
    gap:1px; background:var(--line); border:1px solid var(--line);
    border-radius:var(--r); overflow:hidden; margin:28px 0;
  }
  .fact{background:var(--card); padding:14px 16px; display:flex; flex-direction:column; gap:3px; box-shadow:var(--gloss-hi)}
  .fact b{font-family:var(--font-mono); font-size:22px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .fact span{font-size:12px; color:var(--muted)}

  .modes{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:8px 0 26px}
  @media (max-width:560px){.modes{grid-template-columns:1fr}}
  .mode{
    position:relative; text-align:left; border-radius:var(--r); padding:20px;
    display:flex; flex-direction:column; gap:7px; overflow:hidden;
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .mode b{font-family:var(--font-display); font-size:20px; font-weight:600; letter-spacing:-.01em}
  .mode .desc{font-size:13.5px; line-height:1.5}
  .mode .go{
    margin-top:5px; font-family:var(--font-mono); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; display:flex; align-items:center; gap:7px;
  }
  .mode .go i{font-style:normal; transition:transform .18s}
  .mode:hover .go i{transform:translateX(4px)}
  .mode .tag{
    position:absolute; top:14px; right:14px; font-family:var(--font-mono);
    font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px;
  }

  /* Study is the primary path, so it carries the solid accent; exam is the
     tinted counterpart. Both sit forward of the white ground. */
  .mode.primary{
    background:linear-gradient(180deg,#17756D 0%,#0F5C57 100%);
    border:1px solid #0B4A46; color:#FFFFFF;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 2px 5px rgba(15,92,87,.22), 0 18px 32px -18px rgba(15,92,87,.6);
  }
  .mode.primary .desc{color:rgba(255,255,255,.86)}
  .mode.primary .go{color:rgba(255,255,255,.95)}
  .mode.primary .tag{background:rgba(255,255,255,.92); color:var(--accent-ink)}
  .mode.primary:hover{transform:translateY(-3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 3px 7px rgba(15,92,87,.26), 0 26px 44px -20px rgba(15,92,87,.7)}

  .mode.secondary{
    background:linear-gradient(180deg,#FFFFFF 0%,var(--accent-soft) 100%);
    border:1.5px solid var(--accent); color:var(--ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 5px rgba(16,29,28,.06), 0 16px 30px -20px rgba(16,29,28,.4);
  }
  .mode.secondary .desc{color:var(--ink-2)}
  .mode.secondary .go{color:var(--accent)}
  .mode.secondary:hover{transform:translateY(-3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 3px 7px rgba(16,29,28,.08), 0 24px 40px -20px rgba(16,29,28,.5)}
  .mode:active{transform:translateY(0)}

  .note{
    background:var(--accent-soft); border-left:3px solid var(--accent);
    border-radius:0 var(--r) var(--r) 0; padding:14px 16px;
    font-size:14px; color:var(--ink-2); display:flex; flex-direction:column; gap:8px;
  }
  .note b{color:var(--ink)}

  .breakdown{width:100%; border-collapse:collapse; margin-top:14px; font-size:14px}
  .breakdown th,.breakdown td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line)}
  .breakdown th{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:500}
  .breakdown td:last-child,.breakdown th:last-child{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums}

  /* ---------- header + rail ---------- */
  .bar{
    position:sticky; top:0; z-index:20; background:rgba(255,255,255,.88); backdrop-filter:saturate(1.6) blur(12px); -webkit-backdrop-filter:saturate(1.6) blur(12px);
    border-bottom:1px solid var(--line); padding:10px 0 0;
  }
  .bar-in{max-width:780px; margin:0 auto; padding:0 20px}
  .bar-row{display:flex; align-items:center; gap:14px; justify-content:space-between; padding-bottom:9px}
  .bar-left{display:flex; align-items:baseline; gap:10px; min-width:0}
  .bar-title{font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
  .timer{
    font-family:var(--font-mono); font-size:15px; font-variant-numeric:tabular-nums;
    padding:2px 9px; border-radius:6px; background:var(--card-2); color:var(--ink-2);
  }
  .timer.low{background:var(--no-soft); color:var(--no)}
  .bar-right{display:flex; align-items:center; gap:8px}
  .mini{
    background:transparent; border:1px solid var(--line); color:var(--ink-2);
    border-radius:7px; padding:5px 11px; font-size:13px; white-space:nowrap;
  }
  .mini:hover{border-color:var(--accent); color:var(--accent)}
  .mini.on{background:var(--flag-soft); border-color:var(--flag); color:var(--flag)}

  .rail{display:flex; gap:2px; padding-bottom:4px; touch-action:manipulation}
  .tick{
    flex:1; height:21px; min-width:0; padding:7px 0; border:0; border-radius:2px;
    background:var(--line); background-clip:content-box;
    transition:background .15s, transform .15s;
  }
  .tick:hover{transform:scaleY(1.6)}
  .tick.done{background:var(--muted)}
  .tick.ok{background:var(--ok)}
  .tick.no{background:var(--no)}
  .tick.flag{background:var(--flag)}
  .tick.now{background:var(--accent); transform:scaleY(1.9)}

  /* ---------- question ---------- */
  .qhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:30px 0 12px}
  .num{font-family:var(--font-mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .chip{
    font-size:11px; font-family:var(--font-mono); letter-spacing:.06em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; background:var(--card-2); color:var(--ink-2);
  }
  .chip.src{background:var(--accent-soft); color:var(--accent-ink)}
  .stem{font-family:var(--font-display); font-size:23px; line-height:1.36; letter-spacing:-.01em; margin-bottom:20px}

  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{
    display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:13px 15px; color:var(--ink); line-height:1.45; box-shadow:var(--gloss-hi);
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  .opt:not(:disabled):hover{border-color:var(--accent); background:var(--accent-soft)}
  .opt:disabled{cursor:default}
  .ltr{
    flex:0 0 24px; height:24px; border-radius:6px; background:var(--card-2);
    font-family:var(--font-mono); font-size:12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; color:var(--ink-2); margin-top:1px;
  }
  .opt.correct{border-color:var(--ok); background:var(--ok-soft)}
  .opt.correct .ltr{background:var(--ok); color:#fff}
  .opt.wrong{border-color:var(--no); background:var(--no-soft)}
  .opt.wrong .ltr{background:var(--no); color:#fff}
  .opt.picked{border-width:2px}
  .otext{flex:1; min-width:0}
  .why{display:block; font-size:13.5px; color:var(--ink-2); margin-top:5px; line-height:1.5}
  .verdict{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; margin-right:6px}
  .verdict.y{color:var(--ok)} .verdict.n{color:var(--no)}

  .key{
    margin-top:16px; background:var(--card); box-shadow:var(--gloss-hi); border:1px solid var(--line);
    border-left:3px solid var(--accent); border-radius:0 var(--r) var(--r) 0; padding:14px 16px;
  }
  .key .eyebrow{display:block; margin-bottom:5px}
  .key p{font-size:14.5px; color:var(--ink-2); line-height:1.55}
  .key .ref{display:block; margin-top:8px; font-family:var(--font-mono); font-size:11.5px; color:var(--muted)}

  .nav{display:flex; gap:10px; margin-top:26px; align-items:center}
  .btn{
    background:var(--accent); color:var(--on-accent); border:0; border-radius:8px;
    padding:11px 22px; font-weight:600; font-size:15px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--line); font-weight:500}
  .btn.ghost:hover{border-color:var(--accent); color:var(--accent); filter:none}
  .btn:disabled{opacity:.35; cursor:default; filter:none}
  .spacer{flex:1}

  /* ---------- results ---------- */
  .score{display:flex; align-items:baseline; gap:14px; margin:8px 0 4px}
  .score b{font-family:var(--font-mono); font-size:66px; font-weight:600; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums}
  .verdictbig{font-family:var(--font-display); font-size:22px; font-weight:600}
  .pass{color:var(--ok)} .fail{color:var(--no)}
  .meter{position:relative; height:12px; background:var(--card-2); border-radius:6px; margin:20px 0 6px; overflow:hidden}
  .meter i{display:block; height:100%; background:var(--accent); border-radius:6px}
  .meter i.fail{background:var(--no)}
  .passline{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); opacity:.75}
  .meterlab{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--muted)}
  .revq{border-top:1px solid var(--line); padding:22px 0}

  /* ---------- mobile ---------- */
  @media (max-width:640px){
    body{font-size:15.5px}
    .wrap{padding:0 16px 72px}
    .bar-in{padding:0 16px}
    .hero{padding:40px 0 24px; gap:14px}
    .hero .lede{font-size:16px}
    .facts{grid-template-columns:repeat(3,1fr); margin:22px 0}
    .fact{padding:11px 12px}
    .fact b{font-size:19px}
    /* header: let it wrap rather than squeeze the timer and buttons off-screen */
    .bar-row{flex-wrap:wrap; gap:8px 10px}
    .bar-title{font-size:11px}
    .bar-right{margin-left:auto}
    .num.count{display:none}
    .stem{font-size:20px; margin-bottom:16px}
    .qhead{margin:22px 0 10px}
    .opt{padding:12px 13px; gap:10px}
    .why{font-size:13px}
    .nav{flex-wrap:wrap}
    .nav .btn{flex:1 1 auto; min-width:120px; padding:12px 16px}
    .score b{font-size:52px}
    .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
  }
  @media (max-width:380px){
    .facts{grid-template-columns:repeat(2,1fr)}
    .stem{font-size:19px}
  }
  /* touch devices get no hover lift, which otherwise sticks after a tap */
  @media (hover:none){
    .mode:hover{transform:none}
    .mode:hover .go i{transform:none}
    .tick:hover{transform:none}
    .opt:not(:disabled):hover{background:var(--card); border-color:var(--line)}
  }

  .eyebrow.sect{display:block; margin:30px 0 12px}
  .tiers{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  .mode.tier{
    background:linear-gradient(180deg,#FFFFFF 0%,var(--accent-soft) 100%);
    border:1.5px solid var(--accent); color:var(--ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 5px rgba(16,29,28,.06), 0 16px 30px -20px rgba(16,29,28,.4);
  }
  .mode.tier .desc{color:var(--ink-2)}
  .mode.tier .go{color:var(--accent)}
  .mode.tier:hover{transform:translateY(-3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 3px 7px rgba(16,29,28,.08), 0 24px 40px -20px rgba(16,29,28,.5)}
  .dots{font-size:12px; letter-spacing:3px; color:var(--accent); line-height:1}
  .mode.wide{width:100%; margin-bottom:26px}
  @media (max-width:640px){
    .tiers{grid-template-columns:1fr; gap:10px}
    .mode.tier{padding:16px}
    .eyebrow.sect{margin:24px 0 10px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const TOPICS = [
  "ESG & SDGs",
  "Stakeholder Engagement",
  "Materiality: Impact vs Financial",
  "Material Threats & Opportunities",
  "Carbon Footprint & Net Zero",
  "ESG & Sustainability Reporting",
  "Bursa, NSRF & IFRS S1/S2",
  "ESG Governance",
  "GRI Standards",
  "Greenwashing & Terms"
];

// m:true = concept appears in the official mock paper. ref = manual topic/page.
const ALL = [{"t":0,"p":1,"s":"What does ESG stand for?","o":["Environmental, Social, Governance","Economic, Social, Government","Environmental, Safety, Growth","Ethical, Sustainable, Green"],"a":0,"e":["Correct. Environmental, Social and Governance.","Government is not the G in ESG.","Not the syllabus terms.","Not the syllabus terms."],"k":"ESG = Environmental, Social, Governance.","r":"Topic 01: ESG criteria, p.2","d":0},{"t":0,"p":1,"s":"What are the three pillars of Sustainability?","o":["Environment, Social, Governance","Environment, Economics, Social","Environment, People, Government","Environment, Ergonomic, People"],"a":1,"e":["That is ESG, a different framework, and the examiners use it here to catch you.","Correct. The Triple Bottom Line: Environment, Economics, Social.","Government is not a pillar.","Not syllabus terms."],"k":"Sustainability = Triple Bottom Line (Planet, Profit, People). ESG is a different list. Most-missed question on the mock.","r":"Topic 01: Triple Bottom Line, p.3","d":0},{"t":0,"p":1,"s":"What does the term SDGs stand for?","o":["Sustainability Directive Governments","Sustainable Development Goals","Stronger Direct Governance","Social Development Group"],"a":1,"e":["Not a real term.","Correct. The UN's Sustainable Development Goals.","Not a real term.","Not a real term."],"k":"SDGs = Sustainable Development Goals, part of the UN's 2030 Agenda.","r":"Topic 01: UN 2030 Agenda, p.5","d":0},{"t":0,"p":1,"s":"How many Sustainable Development Goals are there?","o":["12","15","17","20"],"a":2,"e":["Too few.","Too few.","Correct. 17 goals running through 2030.","Too many."],"k":"17 goals, 169 targets, adopted 25 September 2015, running to 2030.","r":"Topic 01: The SDGs are, p.6","d":0},{"t":0,"p":0,"s":"How is Sustainability defined in the manual?","o":["Reducing carbon emissions to zero","Fulfilling the needs of the current generation without hindering future generations' ability to meet theirs","Complying with environmental law","Maximising shareholder returns responsibly"],"a":1,"e":["Too narrow.","Correct, and this is the classic Brundtland-style definition used throughout.","Compliance is only part of it.","Not the definition given."],"k":"Sustainability = meeting today's needs without compromising future generations.","r":"Topic 01: What is Sustainability, p.3","d":0},{"t":0,"p":1,"s":"To which element of ESG does Carbon Footprint belong?","o":["Environment","Social","Governance","All of the above"],"a":0,"e":["Correct. Emissions are an environmental matter.","Social covers relationships with stakeholders.","Governance covers leadership and controls.","It sits under E specifically."],"k":"Carbon footprint is Environmental. E = stewardship of nature, S = stakeholder relationships, G = leadership and controls.","r":"Topic 01: ESG criteria, p.2","d":0},{"t":1,"p":0,"s":"How does the manual define a Sustainability Stakeholder?","o":["Anyone who owns shares in the company","Individuals, organisations and groups that are impacted by, or can impact, the sustainability performance of the organisation","Only regulators and investors","Employees and customers only"],"a":1,"e":["Shareholders are one group among many.","Correct, and note it runs in both directions.","Far too narrow.","Far too narrow."],"k":"Stakeholders both affect and are affected. The bigger the potential impact, the more important the stakeholder.","r":"Topic 02: Sustainability Stakeholders, p.10","d":0},{"t":1,"p":0,"s":"Which of these is an INTERNAL stakeholder?","o":["Suppliers","Customers","Shareholders","Local community"],"a":2,"e":["Suppliers sit outside the organisation.","Customers sit outside the organisation.","Correct. Internal stakeholders are part of the organisation, including shareholders and investors.","The community is external."],"k":"Internal = part of the organisation (shareholders, investors, employees). External = suppliers, customers, community, regulators.","r":"Topic 02: Identify Stakeholders, p.12","d":0},{"t":1,"p":1,"s":"Which level of stakeholder engagement applies to HIGH dependency and HIGH influence?","o":["Push communication","Consultation","Partnership","Pull communication"],"a":2,"e":["That is the low/low end of the ladder.","Consultation suits high dependency but low influence.","Correct. Partnership is the deepest form of engagement.","The lightest touch of all."],"k":"Ladder from strongest to weakest: Partnership, Dialogue, Consultation, Push communication, Pull communication.","r":"Topic 02: Type of Stakeholder Engagement, p.18","d":0},{"t":1,"p":0,"s":"Why must organisations prioritise their stakeholders?","o":["Regulators require a ranked list","An organisation has limited time and resources to engage them all","Only listed companies have stakeholders","To reduce the number of stakeholders"],"a":1,"e":["Not the reason given.","Correct. Limited time and resources, and not every stakeholder impacts the organisation equally.","All organisations have stakeholders.","Prioritising does not remove anyone."],"k":"Prioritisation exists because resources are finite and some stakeholder opinions carry more weight.","r":"Topic 02: Stakeholder Prioritization, p.14","d":0},{"t":1,"p":0,"s":"A customer satisfaction survey is an example of which engagement type?","o":["Partnership","Consultation","Dialogue","Joint venture"],"a":1,"e":["Partnership covers joint ventures and community projects.","Correct. Surveys, questionnaires and focus groups are Consultation.","Dialogue covers grievance mechanisms and advisory boards.","A joint venture is a Partnership activity."],"k":"Consultation = focus groups, questionnaires, surveys, internal assessments.","r":"Topic 02: Stakeholder Engagement Process, p.18","d":0},{"t":2,"p":1,"s":"What are the two types of Materiality?","o":["Up and Down Impact","Single and Double Materiality","Outward and Inward Impact","Strong and Weak Materiality"],"a":2,"e":["Not syllabus terminology.","Tempting, but the official answer key marks this wrong.","Correct per the official key. Outward = your impact on the world, Inward = the world's impact on you.","Not used in any framework here."],"k":"Outward (impact, GRI) and Inward (financial, ISSB). Double materiality is both combined, not one of the two.","r":"Topic 03: Financial vs Impact Materiality, p.23","d":0},{"t":2,"p":0,"s":"Impact materiality captures which direction of impact?","o":["Inside-out","Outside-in","Top-down","Bottom-up"],"a":0,"e":["Correct. Impact materiality is the inside-out impact of a business on people, planet and society.","Outside-in is financial materiality.","Not the terminology used.","Not the terminology used."],"k":"Impact materiality = inside-out. Financial materiality = outside-in. In economic terms the inside-out impacts are externalities.","r":"Topic 03: Impact Materiality, p.23","d":0},{"t":2,"p":0,"s":"Financial materiality focuses on issues that affect:","o":["Community wellbeing","The company's financial performance, valuation or access to capital","Employee satisfaction","Biodiversity"],"a":1,"e":["That is impact materiality.","Correct, and its audience is primarily investors and regulators.","An impact concern unless it affects financials.","An impact concern."],"k":"Financial materiality = effect on financial performance, valuation and access to capital. Audience: investors and regulators.","r":"Topic 04: Financial Materiality, p.25","d":0},{"t":2,"p":0,"s":"Double materiality is best described as:","o":["Reporting the same issue twice","Combining financial materiality and impact materiality","Materiality reviewed every two years","Materiality assessed by two auditors"],"a":1,"e":["Not the meaning.","Correct. It serves both investors and society at large.","Not the meaning.","Not the meaning."],"k":"Double materiality = financial + impact together. Promoted by EU CSRD, EFRAG and GRI.","r":"Topic 04: Double Materiality, p.25","d":0},{"t":2,"p":0,"s":"Materiality is the principle of:","o":["Reporting every sustainability matter in full","Identifying and assessing a wide range of sustainability matters and refining them to those most important to the organisation and its stakeholders","Measuring carbon emissions accurately","Obtaining external assurance"],"a":1,"e":["Materiality is about narrowing down, not reporting everything.","Correct.","That is carbon accounting.","That is assurance."],"k":"Materiality narrows a wide field of matters down to what matters most to the organisation AND its stakeholders.","r":"Topic 03: What is Materiality, p.20","d":0},{"t":3,"p":1,"s":"What are the two axes of the Materiality Matrix?","o":["Stakeholder View and Own Organizational View","Material View and Influence View","Environmental View and Social View","Governance and Government View"],"a":0,"e":["Correct. Vertical is the stakeholder view, horizontal the organisational view.","Not syllabus wording.","The matrix is not split by ESG pillar.","Not a matrix axis."],"k":"Vertical = influence on stakeholder assessments and decisions. Horizontal = significance of the organisation's economic, environmental and social impacts.","r":"Topic 04: The Materiality Matrix, p.29","d":0},{"t":3,"p":1,"s":"In setting sustainability targets, SMART stands for:","o":["Specific, Measurable, Achievable, Relevant, Timed","Sustainable, Material, Accurate, Reported, Tracked","Strategic, Managed, Assured, Reviewed, Transparent","Scientific, Measured, Audited, Ranked, Targeted"],"a":0,"e":["Correct. Note the manual uses 'Timed'.","Invented terms.","Invented terms.","Invented terms."],"k":"SMART: Specific, Measurable, Achievable, Relevant, Timed.","r":"Topic 04: Setting Targets the SMART Way, p.34","d":0},{"t":3,"p":0,"s":"What does the vertical axis of the materiality matrix measure?","o":["Significance of the organisation's impacts","Influence on stakeholder assessments and decisions","Cost of managing the issue","Regulatory penalties"],"a":1,"e":["That is the horizontal axis.","Correct.","Not an axis.","Not an axis."],"k":"Vertical = stakeholder influence. Horizontal = significance of the organisation's economic, environmental and social impacts.","r":"Topic 04: The Materiality Matrix, p.29","d":0},{"t":3,"p":0,"s":"'Management approach' refers to:","o":["The board's leadership style","How companies manage each of the material sustainability matters they have prioritised","The choice of reporting framework","The assurance provider's methodology"],"a":1,"e":["Not the definition.","Correct.","That is a reporting decision.","That is assurance."],"k":"Management approach = how each prioritised material matter is actually managed.","r":"Topic 04: Management Approach, p.32","d":0},{"t":4,"p":1,"s":"What is the unit in which Greenhouse Gas Emissions are calculated?","o":["Tons of CO2","Tons of Gas","Tons of CO2e","Tons of Nitrogen"],"a":2,"e":["CO2 alone ignores the other greenhouse gases.","Not a unit.","Correct. Tonnes of carbon dioxide equivalent.","Not the reporting basis."],"k":"tCO2e. The 'e' means equivalent, converting all GHGs to a common basis.","r":"Topic 05: Calculating Carbon Footprint, p.42","d":0},{"t":4,"p":1,"s":"Scope 1 emissions are:","o":["Direct emissions from sources owned or controlled by the organisation","Emissions from purchased electricity","Value chain emissions","Emissions from employee commuting"],"a":0,"e":["Correct. Boilers, furnaces and company vehicles are the standard examples.","That is Scope 2.","That is Scope 3.","That is Scope 3."],"k":"Scope 1 = direct, owned or controlled. Scope 2 = purchased energy. Scope 3 = everything else in the value chain.","r":"Topic 05: Scope of Carbon Emissions, p.41","d":0},{"t":4,"p":1,"s":"Which Carbon Emission Scope is the electricity we use in our buildings?","o":["Scope 1","Scope 2","Scope 3","Scope 4"],"a":1,"e":["Scope 1 is direct emissions from owned sources.","Correct. Purchased electricity, steam and heat.","Scope 3 is other indirect value chain emissions.","There is no Scope 4."],"k":"Scope 2 = purchased electricity, steam and heat. The emissions occur where the energy is generated, not where it is used.","r":"Topic 05: Scope of Carbon Emissions, p.41","d":0},{"t":4,"p":1,"s":"Employee commuting and business travel fall under which scope?","o":["Scope 1","Scope 2","Scope 3","They are not reported"],"a":2,"e":["Scope 1 is owned sources.","Scope 2 is purchased energy.","Correct. Scope 3 covers other indirect emissions from sources not owned or controlled by the organisation.","They are reported under Scope 3."],"k":"Scope 3 examples: employee commuting, business travel, purchased goods and services. Usually the largest and hardest to measure.","r":"Topic 05: Scope of Carbon Emissions, p.41","d":0},{"t":4,"p":1,"s":"How many scopes of emissions are typically considered in a carbon footprint assessment?","o":["Two","Three","Four","Five"],"a":1,"e":["Two omits the value chain.","Correct. Three scopes.","There is no Scope 4.","There is no Scope 5."],"k":"Three scopes. Any option offering Scope 4 or 5 is a distractor.","r":"Topic 05: Scope of Carbon Emissions, p.41","d":0},{"t":4,"p":1,"s":"Net Zero refers to achieving a balance between:","o":["Revenue and cost of carbon","The amount of GHG produced and the amount removed from the atmosphere","Scope 1 and Scope 2 emissions","Offsets purchased and credits sold"],"a":1,"e":["Not the definition.","Correct.","Not the definition.","Not the definition."],"k":"Net Zero = emissions produced balanced against emissions removed, via efficiency, renewables and carbon removal for the remainder.","r":"Topic 05: Definition of Net Zero, p.43","d":0},{"t":4,"p":0,"s":"A carbon offset is:","o":["A tax on emissions","A measurable reduction or removal of GHG emissions, created by a project, used to compensate for emissions elsewhere","A government permit to pollute","An accounting adjustment"],"a":1,"e":["Not an offset.","Correct.","That describes a carbon credit.","Not an offset."],"k":"Offset = you fund a project that reduces or removes emissions to compensate for your own. Measured in tCO2e.","r":"Topic 05: Carbon Offset, p.50","d":0},{"t":4,"p":1,"s":"What does SBTi stand for?","o":["Sustainability Baseline Targets Initiative","Sustainability Based Timeline Initiative","Science Based Targets initiative","Standard Business Target Index"],"a":2,"e":["Not a real body.","Not a real body.","Correct.","Not a real body."],"k":"SBTi = Science Based Targets initiative. An SBT commits to a science-based reduction trajectory with no offsets used for the reduction.","r":"Topic 05: Types of Carbon Targets, p.47","d":0},{"t":5,"p":1,"s":"What does SASB stand for?","o":["Sustainability Accounting Standards Board","Social Administration Standards Board","Standards for Administration of Sustainability Board","None of the above"],"a":0,"e":["Correct.","Not a real body.","Not a real body.","A is correct."],"k":"SASB = Sustainability Accounting Standards Board. Investor-focused, industry-specific.","r":"Topic 06: The SASB Mission, p.59","d":0},{"t":5,"p":1,"s":"What does GRI stand for?","o":["Global Reporting Initiative","General Reporting Index","Green Reporting Institute","Global Responsibility Index"],"a":0,"e":["Correct.","Not a real body.","Not a real body.","Not a real body."],"k":"GRI = Global Reporting Initiative. An international, independent not-for-profit, established in Amsterdam in 2002.","r":"Topic 09: The GRI Standards, p.143","d":0},{"t":5,"p":1,"s":"What does Integrated Reporting mean?","o":["Various parts of the annual report are integrated","The report focuses on business value","Various capitals are reported together","All of the above"],"a":3,"e":["True but incomplete.","True but incomplete.","True but incomplete.","Correct. Integrated Reporting combines all three."],"k":"Integrated Reporting combines financial and sustainability reporting in one report and shows value creation over time across the capitals.","r":"Topic 06: Integrated Reporting, p.70","d":0},{"t":5,"p":0,"s":"ESRS stands for:","o":["European Sustainability Reporting Standards","ESG Sustainability Rating System","Environmental and Social Risk Standards","European Social Responsibility Statement"],"a":0,"e":["Correct.","Not a real framework.","Not a real framework.","Not a real framework."],"k":"ESRS = European Sustainability Reporting Standards, the EU's reporting standards under CSRD.","r":"Topic 06: ESRS Architecture, p.63","d":0},{"t":5,"p":0,"s":"ESG Reporting is best described as:","o":["A quarterly financial filing","The annual disclosure of the ESG performance of the organisation","An internal audit report","A marketing brochure"],"a":1,"e":["ESG reporting is annual, not quarterly, and not financial.","Correct. A narrative statement of management of material economic, environmental and social risks and opportunities.","Not a disclosure to the market.","Not a formal disclosure."],"k":"ESG reporting = annual disclosure of ESG performance, narrative in nature, covering material risks and opportunities.","r":"Topic 06: What is ESG Reporting, p.56","d":0},{"t":6,"p":0,"s":"Which exchange requires Malaysian listed issuers to publish a Sustainability Statement?","o":["Singapore Exchange","Bursa Malaysia","Hong Kong Stock Exchange","London Stock Exchange"],"a":1,"e":["Not the Malaysian regulator.","Correct, via the Main Market Listing Requirements.","Not the Malaysian regulator.","Not the Malaysian regulator."],"k":"Bursa Malaysia mandates the Sustainability Statement through the Main Market Listing Requirements (MMLR).","r":"Topic 07: Bursa Malaysia, p.77","d":0},{"t":6,"p":1,"s":"What are the four pillars of TCFD?","o":["Governance, Strategy, Risk Management, Metrics and Targets","Environment, Social, Governance, Economic","Plan, Do, Check, Act","Policy, Assumptions, Calculators, Education"],"a":0,"e":["Correct, and IFRS S1 and S2 adopt this same structure.","Those are ESG pillars.","That is a management cycle.","That is the NSRF's PACE initiative."],"k":"TCFD four pillars: Governance, Strategy, Risk Management, Metrics and Targets. Now absorbed into IFRS S2.","r":"Topic 07: The 4 Pillars, p.105","d":0},{"t":6,"p":1,"s":"What does IFRS S2 deal with?","o":["General compliance","Climate-related disclosures, including GHG emissions","GRI compliance","Integrated reporting"],"a":1,"e":["That is IFRS S1.","Correct.","GRI is a separate framework.","A different framework."],"k":"IFRS S1 = general sustainability disclosures. IFRS S2 = climate. The mock writes 'IFRS 2' but means IFRS S2.","r":"Topic 07: IFRS S2, p.117","d":0},{"t":6,"p":0,"s":"What does IFRS S1 cover?","o":["Climate only","General requirements for disclosure of sustainability-related financial information","Share-based payment","Carbon offsets"],"a":1,"e":["Climate is IFRS S2.","Correct.","That is IFRS 2 without the S, an accounting standard unrelated to this syllabus.","Not a standard."],"k":"IFRS S1 = general sustainability-related financial disclosures, investor-focused, based on financial materiality.","r":"Topic 07: IFRS S1, p.111","d":0},{"t":6,"p":1,"s":"The NSRF's carbon footprint requirements are based on which standard?","o":["BCRD","ECRS","GRI","ISSB"],"a":3,"e":["Not a real standard.","Not a real standard.","GRI is impact-focused and is not the NSRF basis.","Correct. The NSRF aligns with the ISSB's IFRS S1 and S2."],"k":"NSRF to ISSB to IFRS S1 and S2. The key Malaysia-specific link in the syllabus.","r":"Topic 07: NSRF, p.98","d":0},{"t":6,"p":0,"s":"What does TCFD stand for?","o":["Task Force on Climate-related Financial Disclosures","Technical Committee for Financial Disclosure","Total Carbon Footprint Disclosure","Transition Committee on Financial Data"],"a":0,"e":["Correct.","Not a real body.","Not a real body.","Not a real body."],"k":"TCFD = Task Force on Climate-related Financial Disclosures.","r":"Topic 07: Climate Change Reporting, p.81","d":0},{"t":6,"p":1,"s":"What term is used when a third party examines the Sustainability Statement?","o":["External Audit","Third Party Audit","External Assurance","Internal Audit"],"a":2,"e":["Audit applies to financial statements.","Not the term used.","Correct.","Internal audit is a review by the company's own function."],"k":"External Assurance, not audit. It comes in two levels: limited and reasonable.","r":"Topic 07: Statement of Assurance, p.102","d":0},{"t":7,"p":0,"s":"Governance criteria in ESG refers to a company's:","o":["Carbon reduction pathway","Leadership, management philosophy, practices, policies, internal controls and shareholder rights","Community relationships","Environmental permits"],"a":1,"e":["An environmental matter.","Correct.","That is Social criteria.","An environmental matter."],"k":"E = environmental stewardship. S = relationships with and value for stakeholders. G = leadership, policies, internal controls, shareholder rights.","r":"Topic 01: ESG criteria, p.2","d":0},{"t":7,"p":1,"s":"What are the three elements of ESG Governance?","o":["Board, Management, Shareholders","Strategy and Stewardship; Management and Monitoring; Accountability and Assurance","Policy, Process, Performance","Disclose, Assure, Report"],"a":1,"e":["Actors, not elements.","Correct.","Not syllabus wording.","Not syllabus wording."],"k":"Strategy and Stewardship, Management and Monitoring, Accountability and Assurance.","r":"Topic 08: Three Elements of ESG Governance, p.139","d":0},{"t":7,"p":0,"s":"Under Bursa's requirements, who must the governance structure disclosure cover?","o":["Only the CEO","The structures in place to manage economic, environmental and social risks and opportunities","Only the external auditor","Only the sustainability manager"],"a":1,"e":["Too narrow.","Correct. All listed issuers must disclose this.","Assurance is separate.","Too narrow."],"k":"Governance structure = the structures ensuring accountability, oversight and review in identifying and managing sustainability matters.","r":"Topic 07: Governance Structure, p.88","d":0},{"t":8,"p":1,"s":"Which GRI series deals with Environmental impacts?","o":["GRI 200","GRI 300","GRI 400","GRI 500"],"a":1,"e":["The 200 series is Economic.","Correct. Energy, water, emissions and so on.","The 400 series is Social.","There is no 500 series."],"k":"200 = Economic, 300 = Environmental, 400 = Social. There is no 500 series.","r":"Topic 09: Topic Standards, p.150","d":0},{"t":8,"p":1,"s":"What does GRI Standard 2 cover?","o":["The Reporting Foundation","General Disclosures to be made","Material Topics","Governance only"],"a":1,"e":["That is GRI 1.","Correct. Structure, operations, governance, strategy and stakeholder engagement.","That is GRI 3.","Governance is one section within GRI 2."],"k":"GRI 1 Foundation, GRI 2 General Disclosures, GRI 3 Material Topics. All 2021.","r":"Topic 09: Universal Standards, p.148","d":0},{"t":8,"p":0,"s":"What does GRI 1 cover?","o":["Foundation: the purpose of the GRI Standards, key concepts and compliance requirements","A list of environmental metrics","Sector-specific disclosures","Assurance requirements"],"a":0,"e":["Correct.","That is the 300 series.","Those are the Sector Standards.","GRI does not set assurance standards."],"k":"GRI 1: Foundation 2021 defines purpose, clarifies key concepts and details compliance requirements, emphasising principles like accuracy and balance.","r":"Topic 09: Universal Standards, p.148","d":0},{"t":8,"p":0,"s":"What does GRI 3 cover?","o":["General disclosures","Material Topics","Economic performance","Sector standards"],"a":1,"e":["That is GRI 2.","Correct. GRI 3: Material Topics 2021.","That is GRI 201.","Those are separate standards."],"k":"GRI 3 provides requirements and guidance for identifying material topics and explaining how impacts are managed.","r":"Topic 09: GRI 3 Material Topics, p.188","d":0},{"t":8,"p":1,"s":"Which GRI series covers Social impacts?","o":["GRI 100","GRI 200","GRI 300","GRI 400"],"a":3,"e":["Not a topic series.","Economic.","Environmental.","Correct. Employment, child labour, public policy and so on."],"k":"400 series = Social: employment, occupational health and safety, training, diversity, human rights, local communities, customer privacy.","r":"Topic 09: Topic Standards, p.150","d":0},{"t":9,"p":1,"s":"When companies pretend to be more environmentally friendly than they actually are, we call that:","o":["Bluewashing","Cleanwashing","Greenwashing","Whitewashing"],"a":2,"e":["Bluewashing uses UN Global Compact association.","Not a syllabus term.","Correct.","Not a syllabus term."],"k":"Greenwashing creates an illusion of being more environmentally friendly and sustainable than the company truly is.","r":"Topic 10: Corporate Greenwashing, p.202","d":0},{"t":9,"p":0,"s":"Social washing is:","o":["Cleaning up a company's social media","Wrongfully marketing the company as socially conscious without going beyond lip service","A form of community investment","An employee wellbeing programme"],"a":1,"e":["Not the definition.","Correct. The social equivalent of greenwashing.","Not the definition.","Not the definition."],"k":"Social washing = claiming social credentials without substance, on labour rights, human rights, gender equality and discrimination.","r":"Topic 10: Other forms of Washing, p.206","d":0},{"t":0,"p":1,"s":"According to the manual, what is the main difference between ESG and Sustainability?","o":["ESG is voluntary, Sustainability is mandatory","ESG focuses more on EXTERNAL investment; Sustainability focuses more on INTERNAL activities","ESG applies only to listed companies","Sustainability covers only environmental matters"],"a":1,"e":["Neither is defined by voluntariness.","Correct.","Not restricted by listing status.","Sustainability looks equally at Environmental, Social and Economic factors."],"k":"ESG = external, investment-oriented, weighted to E and S. Sustainability = internal, future-generations focus, balanced across E, S and Economic.","r":"Topic 01: ESG vs Sustainability, p.4","d":1},{"t":0,"p":1,"s":"How many targets underpin the 17 SDGs?","o":["100","150","169","200"],"a":2,"e":["Too few.","Too few.","Correct. 169 detailed targets.","Too many."],"k":"17 goals, 169 targets, negotiated over two years, agreed by nearly all nations on 25 September 2015.","r":"Topic 01: The SDGs are, p.6","d":1},{"t":0,"p":0,"s":"The manual identifies three things that are new about the SDGs. They are:","o":["Universality, Integration, Transformation","Ambition, Funding, Enforcement","Measurement, Reporting, Verification","Policy, Practice, Performance"],"a":0,"e":["Correct.","Not the three.","Not the three.","Not the three."],"k":"Universality (relevant to every nation and sector), Integration (the goals are interconnected), Transformation (achieving them requires fundamental change).","r":"Topic 01: What is new about these goals, p.7","d":1},{"t":0,"p":0,"s":"What is the correct order for aligning a company with the SDGs?","o":["Communicate, measure, set targets, identify materiality","Identify and link materiality, set clear targets, measure the results, communicate the message","Set targets, communicate, identify materiality, measure","Measure, identify materiality, communicate, set targets"],"a":1,"e":["Reversed.","Correct.","Out of order.","Out of order."],"k":"Identify and link materiality, set clear targets, measure results, communicate the message.","r":"Topic 01: How to go about aligning with the SDGs, p.9","d":1},{"t":0,"p":0,"s":"What is the primary objective of a SWOT analysis?","o":["To rank competitors","To help organisations develop a full awareness of all the factors involved in making a business decision","To calculate carbon emissions","To score stakeholders"],"a":1,"e":["Not the stated objective.","Correct.","Unrelated.","Unrelated."],"k":"SWOT compiles strengths, weaknesses, opportunities and threats to give full awareness before a business decision.","r":"Topic 01: Threats and Opportunities, p.4","d":1},{"t":1,"p":0,"s":"A grievance mechanism is an example of which engagement type?","o":["Partnership","Dialogue","Consultation","Other communication"],"a":1,"e":["Partnership covers joint ventures and community projects.","Correct. Dialogue covers grievance mechanisms, advisory boards and multi-stakeholder sessions.","Consultation covers surveys and focus groups.","Other communication covers annual reports and press releases."],"k":"Partnership: joint ventures. Dialogue: grievance mechanisms, advisory boards. Consultation: surveys, focus groups. Other communication: annual report, website, press release.","r":"Topic 02: Stakeholder Engagement Process, p.18","d":1},{"t":1,"p":0,"s":"The manual sets out three questions to answer before engaging stakeholders. They are:","o":["Why engage? What to engage about? Who to engage?","When? Where? How much?","Who pays? Who reports? Who audits?","What is material? What is measurable? What is reportable?"],"a":0,"e":["Correct.","Not in the syllabus.","Confuses engagement with assurance.","Materiality questions."],"k":"WHY engage, WHAT to engage about, WHO to engage.","r":"Topic 02: Three Questions, p.17","d":1},{"t":1,"p":0,"s":"Which of these is a stated objective of stakeholder engagement?","o":["Securing a licence to operate in a certain region","Reducing the audit fee","Avoiding disclosure of negative impacts","Raising the share price before results"],"a":0,"e":["Correct.","Not an engagement objective.","The opposite of balanced disclosure.","Not an engagement objective."],"k":"Objectives: licence to operate, customer satisfaction, minimising negative environmental and social impacts, identifying new opportunities.","r":"Topic 02: Engagement Objectives, p.17","d":1},{"t":1,"p":0,"s":"Stakeholder DEPENDENCY describes:","o":["How much a stakeholder can affect the organisation","How much a stakeholder needs the organisation for resources, services or outcomes","How often the organisation reports","How close the stakeholder is geographically"],"a":1,"e":["That is influence.","Correct.","Not the definition.","Proximity is a separate identification question."],"k":"Dependency = how much they need you. Influence = how much they can affect you. Use dependency to design support, influence to design risk management.","r":"Topic 02: Dependency-Influence, p.15","d":1},{"t":1,"p":0,"s":"For stakeholders with LOW dependence but HIGH influence, the manual advises:","o":["Minimum effort, keep sufficiently informed","Fully engage and collaborate on solutions","Proactively address their concerns, as they may influence other significant stakeholders","Ignore them until they raise an issue"],"a":2,"e":["That is the low/low quadrant.","That is high dependence and high influence.","Correct.","Never the advice given."],"k":"High/high: fully engage. Low dependence and high influence: address proactively as they sway others. High dependence and low influence: keep informed, honour commitments. Low/low: minimum effort.","r":"Topic 02: Stakeholder Prioritization, p.16","d":1},{"t":2,"p":0,"s":"Financial materiality is used by which frameworks?","o":["IFRS, SASB and TCFD","GRI and the UN SDGs","ISO 26000 and ISO 20400","FTSE4Good and MSCI"],"a":0,"e":["Correct.","Those are impact-materiality frameworks.","ISO documents are guidance standards.","Those are rating indices."],"k":"Financial materiality: IFRS, SASB, TCFD, audience investors and regulators. Impact materiality: GRI, UN SDGs, EU CSRD, audience public, NGOs, communities.","r":"Topic 04: Financial Materiality, p.25","d":1},{"t":2,"p":1,"s":"Which frameworks are named as promoting DOUBLE materiality?","o":["SASB and TCFD","EU CSRD, EFRAG and GRI","ISO 26000 and ISO 37000","FTSE4Good and Bursa"],"a":1,"e":["Both are financial-materiality frameworks.","Correct.","Guidance standards, not materiality frameworks.","Not materiality frameworks."],"k":"Double materiality is promoted by EU CSRD, EFRAG and GRI. Example: water use affecting both company cost and local ecosystem.","r":"Topic 04: Double Materiality, p.25","d":1},{"t":2,"p":0,"s":"Under the GRI approach, materiality is described as:","o":["Investor driven","Organisation driven","Regulator driven","Auditor driven"],"a":1,"e":["That is the IFRS and SASB approach.","Correct. GRI materiality is organisation driven, covering significant ESG impacts or matters that substantively influence stakeholder assessments and decisions.","Not the GRI framing.","Not the GRI framing."],"k":"GRI: organisation-driven materiality, audience all stakeholders, subject matter sustainability impact across economic, environmental, social and governance.","r":"Topic 03: Materiality in the different standards, p.24","d":1},{"t":2,"p":0,"s":"Under the Integrated Reporting framework, who is the audience?","o":["All stakeholders","Providers of financial capital with a short, medium and long term perspective","Regulators only","Employees"],"a":1,"e":["That is GRI's audience.","Correct.","Not the IR audience.","Not the IR audience."],"k":"IR audience: providers of financial capital. Subject matter: value creation over time. Disclosure form: the integrated report.","r":"Topic 03: Materiality in the different standards, p.24","d":1},{"t":2,"p":0,"s":"What is 'materiality analysis' as distinct from materiality?","o":["The audit of material topics","The process to determine which ESG issues are both most important to the long-term success of the business and most important to stakeholders","The list of material topics","The board's review of the report"],"a":1,"e":["That is assurance.","Correct.","That is the output, not the process.","Not the definition."],"k":"Materiality = the ESG issues most important to long-term business success. Materiality analysis = the process of determining which issues matter to both business and stakeholders.","r":"Topic 03: Stakeholders and Materiality, p.21","d":1},{"t":3,"p":1,"s":"Which type of materiality recognises that issues immaterial today may become material tomorrow?","o":["Nested materiality","Sector specific materiality","Dynamic materiality","Double materiality"],"a":2,"e":["Nested places impact materiality inside a broader context.","Sector specific covers industry-unique issues.","Correct. Emphasised by the World Economic Forum and TCFD.","Double materiality is about direction, not time."],"k":"Dynamic materiality = material issues evolve. Example: biodiversity loss becoming a financial risk once regulation lands.","r":"Topic 04: Dynamic Materiality, p.26","d":1},{"t":3,"p":0,"s":"Sector specific materiality is most associated with:","o":["SASB Standards and TCFD sector guidance","GRI 1 Foundation","ISO 9001","The Paris Agreement"],"a":0,"e":["Correct.","GRI 1 applies to all organisations.","Quality management.","A climate treaty."],"k":"Sector specific materiality: SASB Standards and TCFD sector guidance. Examples: cybersecurity in tech, water in agriculture, emissions in transport.","r":"Topic 04: Sector Specific Materiality, p.27","d":1},{"t":3,"p":0,"s":"In the 'what matters' grid, an issue with high social value but low business value should be:","o":["Ignored as immaterial","Managed for reputation","Treated as shared value","Recorded as an investment priority"],"a":1,"e":["High social value is never simply ignored.","Correct. That quadrant is Reputational Risk.","Shared value is the high/high quadrant.","Investment is high business value and low stakeholder value."],"k":"Shared Value (high/high), Reputational Risk (high stakeholder, low business), Investment (high business, low stakeholder), Acknowledgement (low/low).","r":"Topic 04: Determining what matters, p.28","d":1},{"t":3,"p":0,"s":"When linking materiality to the SDGs, the manual recommends:","o":["Start from the SDGs and work back to material issues","Determine material issues first, then link them to the SDGs","Report against all 17 SDGs regardless of materiality","Choose the SDGs the CEO prefers"],"a":1,"e":["Explicitly not recommended, as it produces dispersed actions rather than focused strategic choices.","Correct.","Not recommended.","Not a method."],"k":"Determine material issues FIRST, then link to the SDGs. Using the SDGs as the starting point disperses effort.","r":"Topic 04: Linking Materiality with the SDGs, p.33","d":1},{"t":3,"p":0,"s":"Nested materiality is best described as:","o":["Materiality reassessed each year","Placing impact materiality within the broader context of financial materiality and sustainable development","Materiality applied only to subsidiaries","Materiality determined by sector"],"a":1,"e":["That is dynamic materiality.","Correct, and it is used in integrated thinking and multi-capital frameworks like the IIRC.","Not the definition.","That is sector specific materiality."],"k":"Nested materiality places inside-out impact within the wider financial and sustainable development context. Example: social unrest affecting both community wellbeing and business continuity.","r":"Topic 04: Nested Materiality, p.27","d":1},{"t":4,"p":1,"s":"What is the correct order for calculating a carbon footprint?","o":["Collect data, define scope, calculate total, convert","Define the scope, collect data, convert data into emissions, calculate the total","Convert data, define scope, collect data, report","Set targets, measure, verify, disclose"],"a":1,"e":["Scope must come first.","Correct.","Conversion cannot precede collection.","That is the metrics cycle."],"k":"Define scope, collect data, convert using conversion factors, calculate the total in metric tonnes CO2e.","r":"Topic 05: Calculating Carbon Footprint, p.42","d":1},{"t":4,"p":1,"s":"What is the key difference between a carbon CREDIT and a carbon OFFSET?","o":["A credit is a permit to emit under a regulated system; an offset is proof of a reduction or removal by a project","They are identical","A credit is voluntary; an offset is mandatory","An offset is measured in tonnes; a credit is measured in dollars"],"a":0,"e":["Correct.","They are distinct instruments.","Reversed. Credits sit in compliance markets, offsets in voluntary markets.","Both are measured in tonnes of CO2e."],"k":"Credit = tradeable allowance to emit 1 tCO2e, compliance market, cap-and-trade. Offset = proof of 1 tCO2e reduced or removed, voluntary market, project-generated.","r":"Topic 05: Carbon Credit v Carbon Offset, p.51","d":1},{"t":4,"p":0,"s":"Carbon offsets trade in which market?","o":["The compliance (regulated) market","The voluntary carbon market","The Main Market of Bursa Malaysia","The EU Emissions Trading System"],"a":1,"e":["That is where credits trade.","Correct.","An equities market.","A compliance scheme, so it deals in credits."],"k":"Offset to voluntary market. Credit to compliance market (EU ETS, Bursa Carbon Exchange).","r":"Topic 05: Carbon Credit v Carbon Offset, p.51","d":1},{"t":4,"p":1,"s":"Which statement about a Science Based Target (SBT) is correct?","o":["Offsets are purchased to cover all emissions","No offsets are used for the reduction","It applies only to Scope 1","It requires carbon neutrality in the current year"],"a":1,"e":["That describes Carbon Neutral.","Correct.","Not limited to Scope 1.","A different target type."],"k":"Carbon Neutral = buy offsets to compensate. SBT = real reduction on a science-based trajectory, no offsets. Net Zero carries a stronger commitment than carbon neutral.","r":"Topic 05: Types of Carbon Targets, p.47","d":1},{"t":4,"p":0,"s":"What is the main greenwashing risk attached to a Carbon Neutral claim?","o":["It is too expensive","Being accused of greenwashing without any actual carbon reduction","It excludes Scope 1","It requires external assurance"],"a":1,"e":["Cost is not the stated risk.","Correct. The company buys offsets to compensate rather than reducing.","Some companies commit to Scopes 1 and 2 only, but that is not the risk named.","Not the stated risk."],"k":"Carbon Neutral relies on purchased offsets, so without genuine reduction it invites a greenwashing accusation.","r":"Topic 05: Types of Carbon Targets, p.47","d":1},{"t":4,"p":0,"s":"Direct emissions are also known as:","o":["Scope 1 emissions under the GHG Protocol Corporate Standard","Scope 2 emissions","Scope 3 emissions","Value chain emissions"],"a":0,"e":["Correct.","Indirect emissions are Scope 2.","Scope 3 is other indirect.","That is Scope 3."],"k":"Direct emissions = Scope 1. Indirect emissions from purchased energy = Scope 2, both under the GHG Protocol Corporate Standard.","r":"Topic 05: Types of Carbon Emissions, p.40","d":1},{"t":4,"p":0,"s":"Which of these is NOT a listed strategy to achieve Net Zero?","o":["Implementing renewable energy","Sustainable transportation","Waste reduction through circular economy practices","Increasing production volume"],"a":3,"e":["A listed strategy.","A listed strategy.","A listed strategy.","Correct. Not a net zero strategy."],"k":"Strategies: renewable energy, reducing energy consumption, sustainable transportation, waste reduction, supply chain sustainability, carbon offsets.","r":"Topic 05: Strategies to Achieve Net Zero, p.45","d":1},{"t":4,"p":0,"s":"The first step in setting targets to achieve Net Zero is to:","o":["Buy offsets","Establish a baseline of current emissions across the value chain","Publish the target","Appoint an assurer"],"a":1,"e":["Offsets come later, for residual emissions.","Correct.","Reporting comes after target setting.","Assurance is separate."],"k":"Establish a baseline, determine the scope, identify reduction opportunities, set SMART targets, monitor progress with KPIs, report on progress.","r":"Topic 05: Setting Targets to Achieve Net Zero, p.44","d":1},{"t":5,"p":1,"s":"SASB organises sustainability topics into how many broad dimensions?","o":["Three","Four","Five","Eleven"],"a":2,"e":["Too few.","Too few.","Correct.","Eleven is the number of SASB industry sectors."],"k":"Five dimensions: Environment, Social Capital, Human Capital, Business Model & Innovation, Leadership & Governance. Eleven sectors. The exam will try to swap these numbers.","r":"Topic 06: SASB Framework Overview, p.60","d":1},{"t":5,"p":0,"s":"What is the stated mission of SASB?","o":["To enforce environmental law","To develop and disseminate sustainability accounting standards that help public corporations disclose material, decision-useful information to investors","To certify carbon offsets","To rank companies on ESG performance"],"a":1,"e":["Not a regulator.","Correct.","Not its role.","That is a rating agency's role."],"k":"SASB's mission is investor-focused decision-useful disclosure, achieved through evidence-based research and broad stakeholder participation.","r":"Topic 06: The SASB Mission, p.59","d":1},{"t":5,"p":0,"s":"In the sustainability maturity evolution, a company reporting only to satisfy the regulator sits at which stage?","o":["Compliance, which is reactive","Beyond compliance, which is proactive","Integrated strategy","Organisation culture"],"a":0,"e":["Correct.","The first proactive stage.","More advanced.","The most mature stage."],"k":"Pre-compliance, Compliance (REACTIVE), Beyond Compliance, Integrated Strategy, Organisation Culture (PROACTIVE).","r":"Topic 06: Sustainability Maturity Evolution, p.55","d":1},{"t":5,"p":0,"s":"Which body focuses on combining financial reporting and sustainability reporting in one integrated report?","o":["GRI","SASB","The International Integrated Reporting Council","The ISSB"],"a":2,"e":["GRI produces sustainability reporting standards.","SASB produces industry-specific standards.","Correct.","The ISSB sets IFRS Sustainability Disclosure Standards."],"k":"The International Integrated Reporting Council combines financial and sustainability reporting into one integrated report, showing value creation over time.","r":"Topic 06: International Integrated Reporting Council, p.69","d":1},{"t":5,"p":0,"s":"Roughly how long does the average reader spend on a Sustainability Statement?","o":["Under 1 minute","5 to 15 minutes","30 to 45 minutes","Over an hour"],"a":1,"e":["Too short.","Correct, which is why headlines, summaries and graphs matter.","Too long.","Too long."],"k":"5 to 15 minutes. Readers focus on headlines, summaries and graphs; employees favour the social aspect, investors use statements increasingly in decisions.","r":"Topic 06: Who reads Sustainability Statements, p.55","d":1},{"t":6,"p":1,"s":"How many reporting requirements does Bursa Malaysia set out for the Sustainability Statement?","o":["10","12","14","17"],"a":2,"e":["Too few.","Too few.","Correct.","17 is the SDG count."],"k":"14 Bursa reporting requirements, from the Sustainability Statement itself through materiality, stakeholders, risks, governance, scope, KPIs, E/S/G indicators, climate, targets, assurance and format.","r":"Topic 07: The 14 Reporting Requirements, p.79","d":1},{"t":6,"p":1,"s":"Bursa's climate change reporting requirement obliges companies to align disclosures with:","o":["GRI 305 Emissions","TCFD recommendations","ISO 14064","The Paris Agreement"],"a":1,"e":["An emissions topic standard, but not what the requirement names.","Correct. Requirement 11 names TCFD's four pillars.","Not the named requirement.","An inter-governmental treaty."],"k":"Bursa Requirement 11: align with TCFD's Governance, Strategy, Risk Management, Metrics and Targets.","r":"Topic 07: 14 Reporting Requirements #11, p.81","d":1},{"t":6,"p":1,"s":"Under Bursa's requirements, a Sustainability Statement must contain information that is:","o":["Balanced, comparable and meaningful","Audited, certified and notarised","Brief, visual and promotional","Confidential, selective and strategic"],"a":0,"e":["Correct.","Not the requirement.","The opposite of balanced.","The opposite of transparent."],"k":"Balanced (unbiased, no selective reporting), Comparable, Meaningful. Balanced explicitly means not hiding fines and contentious issues.","r":"Topic 07: Sustainability Statement, p.83","d":1},{"t":6,"p":0,"s":"A Statement of Assurance must disclose which elements?","o":["Assurance type, subject matter and scope","Auditor's fee, duration and partner name","Only the assurer's conclusion","The full sampling methodology"],"a":0,"e":["Correct, and for independent assurance the conclusions must also be disclosed.","Not required elements.","Conclusions matter, but so do type, subject matter and scope.","Not a listed element."],"k":"A listed issuer states whether the statement was internally reviewed by internal audit OR independently assured, and if assured, the subject matter, scope and conclusions.","r":"Topic 07: Content of Statement of Assurance, p.102","d":1},{"t":6,"p":1,"s":"IFRS S1's core focus is on which kind of materiality?","o":["Impact materiality","Financial materiality","Dynamic materiality","Sector materiality"],"a":1,"e":["That is the GRI approach.","Correct. Investor-focused, based on effects on cash flows, access to finance or cost of capital.","A WEF and TCFD concept.","The SASB approach."],"k":"IFRS S1 = financial materiality. Entities disclose sustainability matters that could reasonably affect cash flows, financing or cost of capital.","r":"Topic 07: IFRS S1 Core Focus, p.111","d":1},{"t":6,"p":0,"s":"Under IFRS S1, when must sustainability disclosures be published relative to the financial statements?","o":["Three months later","At the same time","Before the financial statements","Whenever convenient"],"a":1,"e":["Not permitted, though transitional relief exists for the first reporting year.","Correct. They must be released simultaneously.","Not the requirement.","Not the requirement."],"k":"IFRS S1 requires financial statements and sustainability disclosures to be published simultaneously, with transitional relief in year one.","r":"Topic 07: IFRS S1 Timing, p.116","d":1},{"t":6,"p":0,"s":"What was the ISSB established to do?","o":["Audit sustainability reports","Create a global baseline for corporate sustainability reporting that meets investors' needs","Set carbon prices","Replace the GRI Standards"],"a":1,"e":["The ISSB is a standard setter, not an assurer.","Correct.","Not its role.","GRI continues to operate alongside."],"k":"The ISSB was established in 2021 to 2022 by the IFRS Foundation to develop global standards for non-financial reporting and create a global baseline for investors.","r":"Topic 06: ISSB, p.68","d":1},{"t":6,"p":0,"s":"Which of the 14 Bursa requirements covers Scope 1, 2 and 3 emissions?","o":["Performance Indicators","Environmental Indicators","Governance Indicators","Assurance"],"a":1,"e":["That is the broader KPI requirement.","Correct. Environmental Indicators covers GHG emissions across Scopes 1, 2 and 3, energy use and efficiency, and water and waste management.","That covers anti-corruption, board diversity and whistleblowing.","That encourages independent assurance."],"k":"Requirement 8 Environmental Indicators: GHG emissions (Scope 1, 2, 3), energy use and efficiency, water and waste management.","r":"Topic 07: 14 Reporting Requirements #8, p.80","d":1},{"t":7,"p":1,"s":"The audit committee and the board's assurance fall under which element of ESG governance?","o":["Strategy and Stewardship","Management and Monitoring","Accountability and Assurance","None, they sit outside ESG governance"],"a":2,"e":["That covers director responsibilities, strategy alignment and policies.","That covers governance structure and day-to-day management.","Correct.","They are explicitly part of ESG governance."],"k":"Accountability and Assurance covers accountability and performance, board assurance, the audit committee, and assurance over sustainability disclosures.","r":"Topic 08: Accountability and Assurance, p.141","d":1},{"t":7,"p":0,"s":"Bursa's governance structure disclosure covers three things. Which set is correct?","o":["Oversight, strategic management, and day-to-day implementation of sustainability matters","Board, committee, and shareholder voting","Policy, procedure, and penalty","Audit, assurance, and attestation"],"a":0,"e":["Correct.","Not the three.","Not the three.","Not the three."],"k":"Governance structure disclosure: oversight of sustainability matters, strategic management of them, and day-to-day implementation.","r":"Topic 07: Governance Structure, p.88","d":1},{"t":7,"p":0,"s":"'Strategy and Stewardship' in ESG governance covers:","o":["Director's responsibilities, alignment with business strategy, business responses to sustainability, and policies","The audit committee","Day-to-day sustainability management","External assurance"],"a":0,"e":["Correct.","That is Accountability and Assurance.","That is Management and Monitoring.","That is Accountability and Assurance."],"k":"Element 1 Strategy and Stewardship: director responsibilities, alignment with business strategy, business responses, policies.","r":"Topic 08: Strategy and Stewardship, p.140","d":1},{"t":8,"p":1,"s":"What is it called when an organisation follows part of the GRI Standards but is not fully compliant?","o":["GRI Semi Compliant","GRI Partly Compliant","GRI Referenced, reporting 'with reference to' the GRI Standards","GRI Compliant"],"a":2,"e":["Not GRI terminology.","Not GRI terminology.","Correct.","'In accordance with' is the full-compliance claim."],"k":"Two claims only: 'in accordance with' (full) and 'with reference to' (partial). Even a with-reference reporter must publish a content index, provide a statement of use and notify GRI.","r":"Topic 09: Reporting with Reference, p.168","d":1},{"t":8,"p":1,"s":"In the GRI Standards, a mandatory requirement is denoted by which word?","o":["Should","Shall","May","Must consider"],"a":1,"e":["'Should' denotes a recommendation.","Correct. 'Shall', shown in bold.","Not a GRI signal word.","Not GRI terminology."],"k":"SHALL = requirement (mandatory, bold). SHOULD = recommendation. Guidance = separate sections, not mandatory.","r":"Topic 09: Using the GRI Standards, p.154","d":1},{"t":8,"p":0,"s":"Which GRI topic standard covers Emissions?","o":["GRI 302","GRI 303","GRI 305","GRI 306"],"a":2,"e":["GRI 302 is Energy.","GRI 303 is Water.","Correct. GRI 305 Emissions.","GRI 306 is Effluents and waste."],"k":"300 series: 301 Materials, 302 Energy, 303 Water, 304 Biodiversity, 305 Emissions, 306 Effluents and waste, 307 Environmental compliance, 308 Supplier environmental assessment.","r":"Topic 09: GRI 300, p.197","d":1},{"t":8,"p":0,"s":"Which GRI topic standard covers Anti-corruption?","o":["GRI 201","GRI 203","GRI 205","GRI 405"],"a":2,"e":["GRI 201 is Economic performance.","GRI 203 is Indirect economic impacts.","Correct. GRI 205 Anti-corruption.","GRI 405 is Diversity and equal opportunity."],"k":"200 series: 201 Economic performance, 202 Market presence, 203 Indirect economic impacts, 204 Procurement practices, 205 Anti-corruption, 206 Anti-competitive behaviour.","r":"Topic 09: GRI 200, p.197","d":1},{"t":9,"p":1,"s":"A company that repeatedly changes its ESG targets before achieving them is engaged in:","o":["Greenrinsing","Greenhushing","Greencrowding","Greenshifting"],"a":0,"e":["Correct.","Greenhushing is hiding sustainability credentials.","Greencrowding is hiding in a group.","Greenshifting is blaming the consumer."],"k":"Greenrinsing = moving the goalposts. Greenhushing = hiding good news. Greencrowding = safety in numbers. Greenshifting = blaming the consumer.","r":"Topic 10: Types of Greenwashing, p.203","d":1},{"t":9,"p":0,"s":"Bluewashing refers to companies that:","o":["Overstate water stewardship","Use association with the UN Global Compact to enhance their image and deflect from controversial practices","Market ocean-friendly products without evidence","Report only Scope 1 and 2"],"a":1,"e":["Not the definition.","Correct.","A form of greenwashing.","A reporting boundary choice."],"k":"Bluewashing trades on UN association. The UN Global Compact was created to bring corporations on board for the MDGs and SDGs.","r":"Topic 10: Other forms of Washing, p.206","d":1},{"t":0,"p":0,"s":"On what date were the Sustainable Development Goals agreed?","o":["25 September 2015","12 December 2015","1 January 2016","4 November 2016"],"a":0,"e":["Correct. Negotiated over a two-year period at the UN.","That is the date the Paris Agreement was adopted.","Not the agreement date.","That is when the Paris Agreement entered into force."],"k":"SDGs agreed 25 September 2015 by nearly all the world's nations, running through 2030.","r":"Topic 01: The SDGs are, p.6","d":2},{"t":0,"p":0,"s":"Which SDG principle states that the goals cannot be pursued in isolation because they form a system?","o":["Universality","Integration","Transformation","Proportionality"],"a":1,"e":["Universality means the goals are relevant to every nation and sector.","Correct. The goals are all inter-connected, so we must achieve them all.","Transformation means achieving them requires fundamental change.","Not an SDG principle; it belongs to the NSRF."],"k":"Universality (relevant to all), Integration (interconnected system), Transformation (fundamental change in how we live).","r":"Topic 01: What is new about these goals, p.8","d":2},{"t":0,"p":0,"s":"Which is NOT given as a reason for companies to align with the SDGs?","o":["Creating additional sustainable value","Adopting a common language when talking about sustainability","Anticipating stakeholder expectations and future policy directions","Qualifying for a tax exemption"],"a":3,"e":["A stated reason.","A stated reason.","A stated reason.","Correct. Not a reason given."],"k":"Reasons: create sustainable value, adopt a common language, surface new opportunities by realigning strategy, anticipate stakeholder expectations and policy directions.","r":"Topic 01: Why align with the SDGs, p.9","d":2},{"t":0,"p":0,"s":"ESG tends to place more emphasis on which factors, relative to Sustainability?","o":["Environmental and Social","Economic and Governance","Social and Economic","Governance and Environmental"],"a":0,"e":["Correct. Sustainability looks equally at Environmental, Social and Economic; ESG weights E and S.","Not the stated emphasis.","Not the stated emphasis.","Not the stated emphasis."],"k":"Sustainability weighs Environmental, Social and Economic equally. ESG tilts toward Environmental and Social, and its G covers overall organisational governance, not just sustainability governance.","r":"Topic 01: ESG vs Sustainability, p.4","d":2},{"t":1,"p":0,"s":"In the stakeholder engagement process, at which step does Prioritisation occur?","o":["Step 1, with objectives and scope","Step 2, identification and categorisation","Step 3, stakeholder engagement","Step 4, after engagement"],"a":3,"e":["Step 1 is objectives and scope.","Step 2 is identification and categorisation of sustainability issues.","Step 3 is stakeholder engagement.","Correct. Prioritisation is step 4, followed by step 5 process review."],"k":"1 Objectives and scope, 2 Identification and categorisation of sustainability issues, 3 Stakeholder engagement, 4 Prioritisation, 5 Process review.","r":"Topic 02: Where do Stakeholders come in, p.13","d":2},{"t":1,"p":0,"s":"Whose Stakeholder Engagement Manual is the influence-dependency matrix drawn from?","o":["GRI","AccountAbility","Bursa Malaysia","The ISSB"],"a":1,"e":["GRI produces reporting standards.","Correct. AccountAbility's Stakeholder Engagement Manual Volume 2.","Bursa publishes its own toolkits but is not the source cited.","The ISSB sets disclosure standards."],"k":"The stakeholder influence-dependency matrix template comes from AccountAbility's Stakeholder Engagement Manual Volume 2.","r":"Topic 02: Stakeholder Prioritization, p.14","d":2},{"t":1,"p":0,"s":"In the stakeholder mapping example, which focus area is paired with Government and Regulatory Authorities?","o":["Legal compliance","Industry stewardship","Community investment","Products and services transparency"],"a":0,"e":["Correct.","Industry stewardship pairs with Industrial Peers.","Community investment pairs with Community.","That pairs with Customers."],"k":"Employees: career development, OSH. Government/Regulatory: legal compliance. Media: continuous communication. Community: investment and impact. Industrial peers: stewardship. Customers: transparency.","r":"Topic 02: Stakeholder Mapping, p.13","d":2},{"t":1,"p":0,"s":"Which is identified as a RISK of stakeholder prioritisation?","o":["Spending too little on engagement","Over-focusing on influential stakeholders and neglecting dependent but vulnerable groups","Engaging too many stakeholders equally","Publishing the stakeholder register"],"a":1,"e":["Not the risk named.","Correct, and the mitigation is a register scoring both dependency and influence, reviewed monthly.","Not the risk named.","Not a risk named."],"k":"Risk: neglecting dependent but vulnerable groups causes reputational harm. Mitigation: a stakeholder register scoring both dimensions, reviewed monthly.","r":"Topic 02: Risks, Trade-Offs and Mitigations, p.15","d":2},{"t":2,"p":0,"s":"In purely economic terms, the inside-out impacts captured by impact materiality are referred to as:","o":["Liabilities","Externalities","Contingencies","Provisions"],"a":1,"e":["An accounting term.","Correct.","An accounting term.","An accounting term."],"k":"Impact materiality captures inside-out impacts on people, planet and society over short, medium and long term. In economic terms these are externalities.","r":"Topic 03: Impact Materiality, p.23","d":2},{"t":2,"p":0,"s":"Under SASB, who is the stated audience?","o":["All stakeholders","Investors of companies that engage in public offerings of securities registered under the Securities Act","Regulators in the EU","Employees and unions"],"a":1,"e":["That is GRI's audience.","Correct.","Not SASB's stated audience.","Not SASB's stated audience."],"k":"SASB is US-oriented, guided by the materiality definition adopted by US securities laws and case law, and its disclosures are for use in reports filed with the SEC.","r":"Topic 03: Materiality in the different standards, p.24","d":2},{"t":2,"p":0,"s":"Under IFRS, information is material if omitting or misstating it could:","o":["Trigger a regulatory fine","Influence decisions that users make based on financial information about a specific reporting entity","Reduce the share price by 5% or more","Breach a listing rule"],"a":1,"e":["Not the definition.","Correct, and relevance is based on the nature or magnitude, or both, of the items concerned.","No numeric threshold is used.","Not the definition."],"k":"The IFRS materiality definition is decision-influence based, judged on nature or magnitude or both, in the context of an individual entity's financial report.","r":"Topic 03: Materiality in the different standards, p.24","d":2},{"t":2,"p":0,"s":"Under GRI, a report should cover aspects that reflect significant ESG impacts OR:","o":["Are required by the stock exchange","Substantively influence the assessments and decisions of stakeholders","Are financially quantifiable","Have been externally assured"],"a":1,"e":["Not the GRI test.","Correct.","Not the GRI test.","Not the GRI test."],"k":"GRI's two-limb test: reflect the organisation's significant ESG impacts, OR substantively influence stakeholder assessments and decisions.","r":"Topic 03: Materiality in the different standards, p.24","d":2},{"t":3,"p":0,"s":"In the manual's worked materiality example, the organisation's overall impact score for Hazardous Waste Management was:","o":["50%","70%","73%","100%"],"a":1,"e":["That is the score for strategic and operational risks alone.","Correct. The organisation's overall impact came to 70%.","73% is the stakeholders' overall view of the issue.","100% applies to individual criteria, not the overall."],"k":"Horizontal axis (organisation) = 70% overall impact. Vertical axis (stakeholders) = 73%. Watch which axis a question is asking about.","r":"Topic 04: Determining the axes, p.30","d":2},{"t":3,"p":0,"s":"In the worked stakeholder weighting example, which group carried the highest weightage factor?","o":["Employees at 30%","Customers at 20%","Investors at 20%","Community at 15%"],"a":0,"e":["Correct.","Customers were weighted 20%.","Investors were weighted 20%.","Community was weighted 15%."],"k":"Weightings: Employees 30%, Customers 20%, Investors 20%, Community 15%, Government and Regulators 10%, Suppliers 5%.","r":"Topic 04: Determining the vertical axis, p.30","d":2},{"t":3,"p":0,"s":"Which framework is Nested materiality associated with?","o":["SASB","Integrated thinking and multi-capital frameworks like the IIRC","The GHG Protocol","FTSE4Good"],"a":1,"e":["SASB is sector specific materiality.","Correct.","An emissions accounting standard.","A rating index."],"k":"Nested materiality is used in integrated thinking and multi-capital frameworks such as the IIRC.","r":"Topic 04: Nested Materiality, p.27","d":2},{"t":3,"p":0,"s":"Dynamic materiality is emphasised by which bodies?","o":["The World Economic Forum and TCFD","GRI and EFRAG","ISO and IAF","Bursa and the Securities Commission"],"a":0,"e":["Correct.","Those promote double materiality.","Standards and accreditation bodies.","Malaysian regulators, not the source cited."],"k":"Dynamic materiality: emphasised by the World Economic Forum and TCFD, stakeholder group being all stakeholders and especially long-term investors.","r":"Topic 04: Dynamic Materiality, p.26","d":2},{"t":4,"p":1,"s":"Under SBTi, Scope 3 falls within coverage when it exceeds what share of total emissions?","o":["10%","25%","40%","60%"],"a":2,"e":["Too low.","Too low.","Correct.","Too high."],"k":"The SBTi 40% rule. Worked example: Scope 1+2 = 25m tCO2e, Scope 3 = 350m tCO2e, so 350 of 375m is far above 40% and in scope.","r":"Topic 05: Types of Carbon Targets, p.49","d":2},{"t":4,"p":0,"s":"In the oil and gas example, Scope 3 emissions came mostly from:","o":["Employee commuting","Use of sold products, meaning customers burning fuel","Purchased electricity","Business travel"],"a":1,"e":["A minor Scope 3 category here.","Correct.","That would be Scope 2.","A minor Scope 3 category here."],"k":"For oil and gas, Scope 3 i
